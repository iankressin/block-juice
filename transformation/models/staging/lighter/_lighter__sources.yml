version: 2

# Source name + table name must match the ingestion Source's `name` + `table`.
sources:
  - name: lighter
    schema: "{{ env_var('RAW_SCHEMA', 'raw') }}"
    tables:
      - name: markets
        identifier: lighter_markets
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: candles
        identifier: lighter_candles
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: fundings
        identifier: lighter_fundings
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: exchange_metrics
        identifier: lighter_exchange_metrics
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: open_interest
        identifier: lighter_open_interest
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: trades
        identifier: lighter_trades
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: batches
        identifier: lighter_batches
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: account_logs
        identifier: lighter_account_logs
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: accounts
        identifier: lighter_accounts
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: pnl
        identifier: lighter_pnl
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: tx_stats
        identifier: lighter_tx_stats
        columns:
          - name: id
            data_tests: [unique, not_null]
