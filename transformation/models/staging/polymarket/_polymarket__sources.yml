version: 2

# Source name + table name must match the ingestion Source's `name` + `table`.
sources:
  - name: polymarket
    schema: "{{ env_var('RAW_SCHEMA', 'raw') }}"
    tables:
      - name: markets
        identifier: polymarket_markets
        columns:
          - name: id
            data_tests: [unique, not_null]
