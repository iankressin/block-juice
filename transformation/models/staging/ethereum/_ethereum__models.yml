version: 2

models:
  - name: stg_ethereum__eth_balances
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: wallet
        data_tests: [not_null]
  - name: stg_ethereum__erc20_balances
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: wallet
        data_tests: [not_null]
      - name: token
        data_tests: [not_null]
  - name: stg_ethereum__erc20_transfers
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests: [not_null]
      - name: token
        data_tests: [not_null]
  - name: stg_ethereum__uniswap_v2
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: event
        data_tests:
          - accepted_values:
              arguments:
                values: [PairCreated, Swap]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ethereum__uniswap_v2_transactions')
                field: hash
  - name: stg_ethereum__uniswap_v3
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: event
        data_tests:
          - accepted_values:
              arguments:
                values: [PoolCreated, Swap]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ethereum__uniswap_v3_transactions')
                field: hash
  - name: stg_ethereum__uniswap_v4
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: event
        data_tests:
          - accepted_values:
              arguments:
                values: [Initialize, Swap]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ethereum__uniswap_v4_transactions')
                field: hash
      - name: pool_id
        data_tests: [not_null]
  - name: stg_ethereum__uniswap_v2_transactions
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: hash
        data_tests: [unique, not_null]
      - name: from_address
        data_tests: [not_null]
  - name: stg_ethereum__uniswap_v3_transactions
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: hash
        data_tests: [unique, not_null]
      - name: from_address
        data_tests: [not_null]
  - name: stg_ethereum__uniswap_v4_transactions
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: hash
        data_tests: [unique, not_null]
      - name: from_address
        data_tests: [not_null]
