version: 2

models:
  - name: stg_ethereum__cow_ethflow
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests: [not_null]
      - name: contract
        data_tests: [not_null]
      - name: event
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [OrderPlacement, Trade, Transfer]
  - name: stg_ethereum__cow_ethflow_traces
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: tx_hash
        data_tests: [not_null]
      - name: from_address
        data_tests: [not_null]
      - name: to_address
        data_tests: [not_null]
  - name: stg_ethereum__wallet_transactions
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests: [unique, not_null]
      - name: from_address
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: gas_used
        data_tests: [not_null]
      - name: effective_gas_price
        data_tests: [not_null]
  - name: stg_ethereum__account_state
    data_tests:
      - unique:
          arguments:
            column_name: "block_number || ':' || kind || ':' || address"
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [balance, nonce, code]
      - name: block_number
        data_tests: [not_null]
      - name: address
        data_tests: [not_null]
  - name: stg_ethereum__eth_balances
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: wallet
        data_tests: [not_null]
  - name: stg_ethereum__erc20_balances
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: wallet
        data_tests: [not_null]
      - name: token
        data_tests: [not_null]
  - name: stg_ethereum__erc20_transfers
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests: [not_null]
      - name: token
        data_tests: [not_null]
  - name: stg_ethereum__uniswap_v2
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: event
        data_tests:
          - accepted_values:
              arguments:
                values: [PairCreated, Swap]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ethereum__uniswap_v2_transactions')
                field: hash
  - name: stg_ethereum__uniswap_v3
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: event
        data_tests:
          - accepted_values:
              arguments:
                values: [PoolCreated, Swap]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ethereum__uniswap_v3_transactions')
                field: hash
  - name: stg_ethereum__uniswap_v4
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: event
        data_tests:
          - accepted_values:
              arguments:
                values: [Initialize, Swap]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ethereum__uniswap_v4_transactions')
                field: hash
      - name: pool_id
        data_tests: [not_null]
  - name: stg_ethereum__uniswap_v2_transactions
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: hash
        data_tests: [unique, not_null]
      - name: from_address
        data_tests: [not_null]
  - name: stg_ethereum__uniswap_v3_transactions
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: hash
        data_tests: [unique, not_null]
      - name: from_address
        data_tests: [not_null]
  - name: stg_ethereum__uniswap_v4_transactions
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: hash
        data_tests: [unique, not_null]
      - name: from_address
        data_tests: [not_null]
  - name: stg_ethereum__chainlink_price_feeds
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: answer
        data_tests: [not_null]
      - name: aggregator
        description: >-
          An aggregator that is not in the chainlink_feeds seed is a new one in addresses.json, which needs
          a row there, or its rounds drop out of oracle_prices.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('chainlink_feeds')
                field: aggregator
              config:
                severity: warn
  - name: stg_ethereum__erc20_metadata
    description: >-
      The name, symbol and decimals of each token in evm-erc20-metadata's chains/ethereum/addresses.json, one
      row per token and block read. A bytes32 name or symbol is decoded as text, and zero bytes are dropped.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: token
        data_tests: [not_null]
      - name: name
        description: Null when name() reverted or returned nothing at that block.
      - name: symbol
        description: Null when symbol() reverted or returned nothing at that block.
      - name: decimals
        description: Null when decimals() reverted or returned nothing at that block, since ERC-20 makes it optional. Never assume 18.
  - name: stg_ethereum__contract_deployments
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: transaction_index
        data_tests: [not_null]
      - name: trace_type
        data_tests:
          - accepted_values:
              arguments:
                values: [create, call, suicide]
      - name: trace_address
        data_tests: [not_null]
  - name: stg_ethereum__contract_deployments_transactions
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: hash
        data_tests: [unique, not_null]
      - name: transaction_index
        data_tests: [not_null]
      - name: status
        data_tests: [not_null]
  - name: stg_ethereum__contract_deployments_state_diffs
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: address
        data_tests: [not_null]
      - name: key
        data_tests: [not_null]
      - name: diff_kind
        description: Portal sends no '=' rows; the test fails if it starts to, since the rules read existence from '*' and '-'.
        data_tests:
          - accepted_values:
              arguments:
                values: ['+', '*', '-']
