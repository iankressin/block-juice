version: 2

models:
  - name: stg_base__erc20_transfers
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests: [not_null]
      - name: token
        data_tests: [not_null]
  - name: stg_base__address_code
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: address
        data_tests: [not_null]
      - name: code
        data_tests: [not_null]
  - name: stg_base__op_standard_bridge
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: event
        data_tests:
          - accepted_values:
              arguments:
                values: [ERC20BridgeInitiated, ERC20BridgeFinalized]
      - name: amount
        data_tests: [not_null]
