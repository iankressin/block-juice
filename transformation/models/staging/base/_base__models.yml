version: 2

models:
  - name: stg_base__erc20_transfers
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests: [not_null]
      - name: token
        data_tests: [not_null]
  - name: stg_base__address_code
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: address
        data_tests: [not_null]
      - name: code
        data_tests: [not_null]
  - name: stg_base__op_standard_bridge
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: event
        data_tests:
          - accepted_values:
              arguments:
                values: [ERC20BridgeInitiated, ERC20BridgeFinalized]
      - name: amount
        data_tests: [not_null]
  - name: stg_base__chainlink_price_feeds
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: answer
        data_tests: [not_null]
      - name: aggregator
        description: >-
          An aggregator that is not in the chainlink_feeds seed is a new one in addresses.json, which needs
          a row there, or its rounds drop out of oracle_prices.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('chainlink_feeds')
                field: aggregator
              config:
                severity: warn
