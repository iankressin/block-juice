version: 2

models:
  - name: int_solana_balances
    description: SOL and SPL token balances in the shape latest_balances reads. `asset` is 'sol' or the mint address.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: asset_type
        data_tests:
          - accepted_values:
              arguments:
                values: [native, spl]
      - name: asset
        data_tests: [not_null]
      - name: balance
        data_tests: [not_null]
