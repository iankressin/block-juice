version: 2

models:
  - name: int_ethereum_balances
    description: ETH and ERC-20 balances in the shape latest_balances reads. `asset` is 'eth' or the token address.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: asset_type
        data_tests:
          - accepted_values:
              arguments:
                values: [native, erc20]
      - name: asset
        data_tests: [not_null]
      - name: balance
        data_tests: [not_null]
