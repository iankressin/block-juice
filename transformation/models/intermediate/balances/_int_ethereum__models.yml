version: 2

models:
  - name: int_ethereum_balances
    description: ETH and ERC-20 balances in the shape latest_balances reads. `asset` is 'eth' or the token address.
    config:
      contract:
        enforced: true
    columns:
      - name: id
        data_type: text
        description: The record's key from the raw table, so a rerun replaces it instead of adding another.
        data_tests: [unique, not_null]
      - name: chain
        data_type: text
        description: Which chain this balance was read from.
      - name: wallet
        data_type: text
        description: The address whose balance was read.
      - name: asset_type
        data_type: text
        description: Whether this is a native, erc20, or spl balance.
        data_tests:
          - accepted_values:
              arguments:
                values: [native, erc20]
      - name: asset
        data_type: text
        description: The native asset name ('eth', 'sol', 'btc') or the token or mint address.
        data_tests: [not_null]
      - name: block_number
        data_type: bigint
        description: The block, or Solana slot, this balance was read at.
      - name: balance
        data_type: numeric
        description: The amount in the asset's base units (wei, lamports, satoshis, or token base units).
        data_tests: [not_null]
      - name: _loaded_at
        data_type: timestamp with time zone
        description: When the warehouse wrote this record into the raw table.

unit_tests:
  - name: a_reverted_erc20_balance_call_is_left_out
    description: >-
      Made up: two ERC-20 balance readings of one wallet at one block. The call for the second token
      reverted, as it does before the token is deployed, so its balance is null and it is left out.
    model: int_ethereum_balances
    given:
      - input: ref('stg_ethereum__eth_balances')
        rows: []
      - input: ref('stg_ethereum__erc20_balances')
        rows:
          - {id: a, wallet: "0x00000000000000000000000000000000000000aa", token: "0x00000000000000000000000000000000000000cc", block_number: 100, balance: 5}
          - {id: b, wallet: "0x00000000000000000000000000000000000000aa", token: "0x00000000000000000000000000000000000000dd", block_number: 100, balance: null}
    expect:
      rows:
        - {id: a, asset_type: erc20, asset: "0x00000000000000000000000000000000000000cc", balance: 5}
