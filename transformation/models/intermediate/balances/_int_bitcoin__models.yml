version: 2

models:
  - name: int_bitcoin_balances
    description: BTC balances in the shape latest_balances reads. `asset` is 'btc'.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: asset_type
        data_tests:
          - accepted_values:
              arguments:
                values: [native]
      - name: asset
        data_tests: [not_null]
      - name: balance
        data_tests: [not_null]
