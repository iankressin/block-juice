        - {condition_id: "0xf38448bdd650770b9bbbc27157cff1a0fbdbc3d75f581c9f2a1947c1411f659a", prepared_block: 96926007, prepared_at: "2026-11-07 23:34:27+00", history_complete: true}
        - {condition_id: "0xaa", prepared_block: 96900000, prepared_at: "2026-11-07 12:44:16+00", history_complete: false}

  - name: markets_are_incomplete_while_a_raw_table_is_empty
    description: >-
      The rows of markets_prepared_before_coverage_are_incomplete with no exchange fills loaded. The
      coverage start is then unknown, so proof row 19's condition, prepared in the CTF table's window, is
      not complete. Postgres' greatest() would skip the empty table's null and call it complete.
    model: int_polygon_polymarket_ctf_conditions
    given:
      - input: ref('stg_polygon__polymarket_ctf')
        format: sql
        rows: *coverage_ctf
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
