version: 2

models:
  - name: int_polygon_polymarket_ctf_exchange_v2_fills
    description: >-
      One row per order filled on the three CTF Exchange v2 contracts. Each match has a fill for every
      maker order and one more for the taker order. usdc is pUSD before fees; a buyer pays fee_usdc on
      top and a seller has it taken from usdc.
    config:
      contract:
        enforced: true
    columns:
      - name: id
        data_type: text
        description: The OrderFilled log's key from the raw table.
        data_tests: [unique, not_null]
      - name: version
        data_type: text
        description: Always ctf_exchange_v2.
      - name: exchange
        data_type: text
        description: The exchange contract that emitted the fill.
        data_tests: [not_null]
      - name: block_number
        data_type: bigint
        description: The block the fill was in.
      - name: block_timestamp
        data_type: timestamp with time zone
        description: When that block was mined.
      - name: tx_hash
        data_type: text
        description: The transaction the fill was in.
      - name: log_index
        data_type: integer
        description: The fill's position in that block's logs.
      - name: order_hash
        data_type: text
        description: The order this fill belongs to.
      - name: wallet
        data_type: text
        description: The order's maker, the proxy wallet or Safe that Polymarket shows as the trader.
        data_tests: [not_null]
      - name: counterparty
        data_type: text
        description: The taker field. It is the exchange itself on the taker order's fill.
      - name: is_taker_order
        data_type: boolean
        description: True for the taker order's own fill, whose taker is the exchange.
        data_tests: [not_null]
      - name: token_id
        data_type: numeric
        description: The outcome token the order traded.
        data_tests: [not_null]
      - name: side
        data_type: text
        description: buy or sell, for the wallet.
        data_tests: [not_null, accepted_values: {arguments: {values: [buy, sell]}}]
      - name: shares
        data_type: numeric
        description: Outcome tokens traded.
      - name: usdc
        data_type: numeric
        description: pUSD paid or received, before fees.
      - name: fee_usdc
        data_type: numeric
        description: The fee in pUSD.
      - name: price
        data_type: numeric
        description: usdc divided by shares.

  - name: int_polymarket_outcome_tokens
    description: >-
      One row per outcome token of a Gamma v1 market, which trades on CTF Exchange v1 or v2 and settles
      in ConditionalTokens. Markets without clobTokenIds are left out. outcome_index counts from 0 in
      Gamma's clobTokenIds order, which matches the index set 1 << i (catalog Q6). Task 13 adds the
      Protocol V2 tokens.
    config:
      contract:
        enforced: true
    columns:
      - name: token_id
        data_type: numeric
        description: The outcome token's id, a uint256.
        data_tests: [unique, not_null]
      - name: condition_id
        data_type: text
        description: The condition the token pays on.
        data_tests: [not_null]
      - name: outcome_index
        data_type: integer
        description: The outcome's place in the payout vector, from 0.
        data_tests: [not_null]
      - name: outcome
        data_type: text
        description: Gamma's name for the outcome, such as Up or Yes.
      - name: complement_token_id
        data_type: numeric
        description: The other token, when the condition has two outcomes; otherwise null.
      - name: market_id
        data_type: text
        description: Gamma's market id.
      - name: event_id
        data_type: text
        description: Gamma's event id.
      - name: neg_risk
        data_type: boolean
        description: True when the market belongs to a neg-risk event.
      - name: protocol
        data_type: text
        description: ctf for these rows; protocol_v2 once Task 13 adds them.

  - name: int_polygon_polymarket_ctf_resolutions
    description: >-
      The payout of each outcome of each condition that ConditionalTokens has resolved, from its
      ConditionResolution log. Neg-risk conditions resolve through the same event. payout_fraction is the
      outcome's numerator over the sum of the numerators.
    config:
      contract:
        enforced: true
    columns:
      - name: condition_id
        data_type: text
        description: The resolved condition.
        data_tests: [not_null]
      - name: outcome_index
        data_type: integer
        description: The outcome's place in the payout vector, from 0.
        data_tests: [not_null]
      - name: payout_fraction
        data_type: numeric
        description: The share of one collateral unit that one token of this outcome redeems for.
      - name: resolved_block
        data_type: bigint
        description: The block of the ConditionResolution log.
      - name: resolved_at
        data_type: timestamp with time zone
        description: When that block was mined.
    data_tests:
      - unique:
          arguments:
            column_name: "condition_id || ':' || outcome_index"

  - name: int_polygon_polymarket_ctf_position_changes
    description: >-
      One row per change to a wallet's cash or position from a CTF-era split, merge, redemption or
      conversion, read from the one event that names the user. Each event gives a cash row (token_id
      null) and a row per token it moves. A redemption that names no shares has shares_delta null and
      zeroes_position true: the wallet holds none of that token afterwards. Conditions missing from
      Gamma are left out.
    config:
      contract:
        enforced: true
    columns:
      - name: id
        data_type: text
        description: >-
          <block>:<logIndex>:<token_id> for a token row, <block>:<logIndex>:cash for a cash row, and
          <block>:<logIndex>:cash:<condition_id> for a conversion's cash rows, one per NO condition.
        data_tests: [unique, not_null]
      - name: version
        data_type: text
        description: Always ctf.
      - name: block_number
        data_type: bigint
        description: The block of the event.
      - name: block_timestamp
        data_type: timestamp with time zone
        description: When that block was mined.
      - name: tx_hash
        data_type: text
        description: The transaction of the event.
      - name: log_index
        data_type: integer
        description: The event's position in that block's logs.
      - name: kind
        data_type: text
        description: split, merge, redeem or convert.
        data_tests: [not_null, accepted_values: {arguments: {values: [split, merge, redeem, convert]}}]
      - name: wallet
        data_type: text
        description: The user, never a Polymarket contract.
        data_tests: [not_null]
      - name: condition_id
        data_type: text
        description: The condition the row moves; for a conversion's cash, the NO condition it is booked to.
        data_tests: [not_null]
      - name: token_id
        data_type: numeric
        description: The outcome token moved; null on a cash row.
      - name: shares_delta
        data_type: numeric
        description: Tokens gained, negative when given up; null on a cash row and when the event names no shares.
      - name: usdc_delta
        data_type: numeric
        description: Collateral gained, negative when paid; null on a token row.
      - name: zeroes_position
        data_type: boolean
        description: True when the event leaves the wallet with none of the token, whatever it held.
        data_tests: [not_null]

unit_tests:
  - name: fills_of_a_buy_against_a_sell
    description: Proof row 1. The maker sells 5.106383 shares for 4.8 pUSD; the taker order buys them.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926000:403", event: ctf_exchange_v2.OrderFilled, block_number: 96926000, tx_hash: "0x58f6ac1b129ebbf968d51fd5f66ed0563ee317b5b862e7c8f93bd4ab5e00ba30", log_index: 403, contract: "0xe111180000d2663c0091e4f400237545b87b996b", order_hash: "0xa1", maker: "0x1dd2a69e73ba444ecd5d87f0073d51a670ad51c2", taker: "0x8d220bbd98c5e47d9ae7781811cbba029cbaae40", side: 1, token_id: "21815194618493357610873019371928881814153899863038016502475197588875103719951", maker_amount_filled: "5106383", taker_amount_filled: "4800000", fee: "0"}
          - {id: "96926000:405", event: ctf_exchange_v2.OrderFilled, block_number: 96926000, tx_hash: "0x58f6ac1b129ebbf968d51fd5f66ed0563ee317b5b862e7c8f93bd4ab5e00ba30", log_index: 405, contract: "0xe111180000d2663c0091e4f400237545b87b996b", order_hash: "0xa2", maker: "0x8d220bbd98c5e47d9ae7781811cbba029cbaae40", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 0, token_id: "21815194618493357610873019371928881814153899863038016502475197588875103719951", maker_amount_filled: "4800000", taker_amount_filled: "5106383", fee: "20160"}
    expect:
      rows:
        - {id: "96926000:403", version: ctf_exchange_v2, exchange: "0xe111180000d2663c0091e4f400237545b87b996b", wallet: "0x1dd2a69e73ba444ecd5d87f0073d51a670ad51c2", counterparty: "0x8d220bbd98c5e47d9ae7781811cbba029cbaae40", is_taker_order: false, token_id: "21815194618493357610873019371928881814153899863038016502475197588875103719951", side: sell, shares: "5.106383", usdc: "4.800000", fee_usdc: "0.000000", price: "0.93999999608333334965"}
        - {id: "96926000:405", version: ctf_exchange_v2, exchange: "0xe111180000d2663c0091e4f400237545b87b996b", wallet: "0x8d220bbd98c5e47d9ae7781811cbba029cbaae40", counterparty: "0xe111180000d2663c0091e4f400237545b87b996b", is_taker_order: true, token_id: "21815194618493357610873019371928881814153899863038016502475197588875103719951", side: buy, shares: "5.106383", usdc: "4.800000", fee_usdc: "0.020160", price: "0.93999999608333334965"}

  - name: fills_of_a_mint_match_are_two_buys
    description: >-
      Proof row 2. Both orders buy 8.71 shares, on the two outcomes of one condition. The prices add up
      to 1: 0.51 and 0.49.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926000:98", event: ctf_exchange_v2.OrderFilled, block_number: 96926000, log_index: 98, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x3bfcd24e25e446d31eb4825b96b1ed515e36a199", taker: "0xe439b8e52eeeeda4eff19a10a4307706a85d61b4", side: 0, token_id: "103688884060883873727013522652996002941410548793093120456496990699655719191268", maker_amount_filled: "4442100", taker_amount_filled: "8710000", fee: "0"}
          - {id: "96926000:102", event: ctf_exchange_v2.OrderFilled, block_number: 96926000, log_index: 102, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0xe439b8e52eeeeda4eff19a10a4307706a85d61b4", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 0, token_id: "56491295322642479574009649190264906678337478953962544953766149611910922990327", maker_amount_filled: "4267900", taker_amount_filled: "8710000", fee: "152360"}
    expect:
      rows:
        - {id: "96926000:98", is_taker_order: false, token_id: "103688884060883873727013522652996002941410548793093120456496990699655719191268", side: buy, shares: "8.710000", usdc: "4.442100", fee_usdc: "0.000000", price: "0.51000000000000000000"}
        - {id: "96926000:102", is_taker_order: true, token_id: "56491295322642479574009649190264906678337478953962544953766149611910922990327", side: buy, shares: "8.710000", usdc: "4.267900", fee_usdc: "0.152360", price: "0.49000000000000000000"}

  - name: fills_of_a_merge_match_are_two_sells
    description: >-
      Proof row 3. Both orders sell 4.47 shares, on the two outcomes of one condition. The prices add up
      to 1: 0.95 and 0.05.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926007:659", event: ctf_exchange_v2.OrderFilled, block_number: 96926007, log_index: 659, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x200e9eb918a20e6baf5a60af14c65c9e4384e21d", taker: "0x7e7bc969274a14c241b66846fc699e9d0031afa2", side: 1, token_id: "58052577356328252628183651892588951427801085397945972476159165350688827473483", maker_amount_filled: "4470000", taker_amount_filled: "4246500", fee: "0"}
          - {id: "96926007:662", event: ctf_exchange_v2.OrderFilled, block_number: 96926007, log_index: 662, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x7e7bc969274a14c241b66846fc699e9d0031afa2", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 1, token_id: "110891868994035549509428319985343688940098568959569462043345289006462020533224", maker_amount_filled: "4470000", taker_amount_filled: "223500", fee: "10610"}
    expect:
      rows:
        - {id: "96926007:659", is_taker_order: false, token_id: "58052577356328252628183651892588951427801085397945972476159165350688827473483", side: sell, shares: "4.470000", usdc: "4.246500", fee_usdc: "0.000000", price: "0.95000000000000000000"}
        - {id: "96926007:662", is_taker_order: true, token_id: "110891868994035549509428319985343688940098568959569462043345289006462020533224", side: sell, shares: "4.470000", usdc: "0.223500", fee_usdc: "0.010610", price: "0.05000000000000000000"}

  - name: fee_follows_q1
    description: >-
      Proof row 10. The seller got 5,497,250 = 5,500,000 - 2,750 and the buyer paid 5,500,000 + 271,970.
      The model keeps usdc before fees and the fee in its own column.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926003:333", event: ctf_exchange_v2.OrderFilled, block_number: 96926003, log_index: 333, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x066dea1e1c12871afdffecd2c11cdf9636101bff", taker: "0x7e3a4d652e9ebd60ff54df022950ac736337130e", side: 1, token_id: "95925888873018679830803815086905784068229941729943579604241272453075308214452", maker_amount_filled: "500000000", taker_amount_filled: "5500000", fee: "2750"}
          - {id: "96926003:335", event: ctf_exchange_v2.OrderFilled, block_number: 96926003, log_index: 335, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x7e3a4d652e9ebd60ff54df022950ac736337130e", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 0, token_id: "95925888873018679830803815086905784068229941729943579604241272453075308214452", maker_amount_filled: "5500000", taker_amount_filled: "500000000", fee: "271970"}
    expect:
      rows:
        - {id: "96926003:333", side: sell, shares: "500.000000", usdc: "5.500000", fee_usdc: "0.002750", price: "0.01100000000000000000"}
        - {id: "96926003:335", side: buy, shares: "500.000000", usdc: "5.500000", fee_usdc: "0.271970", price: "0.01100000000000000000"}

  - name: the_taker_order_is_marked
    description: Proof row 11. Only the fill whose taker is the exchange itself has is_taker_order true.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926000:78", event: ctf_exchange_v2.OrderFilled, block_number: 96926000, log_index: 78, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x3089fcf3fe5b67ec287654b4d627bcd1d51135e4", taker: "0x20d2309cd92b797ae7ca175ed828ed8a27fbe29d", side: 0, token_id: "105985080724064245114012949518165989083729807961896494806795246958083187261670", maker_amount_filled: "3650000", taker_amount_filled: "5000000", fee: "0"}
          - {id: "96926000:81", event: ctf_exchange_v2.OrderFilled, block_number: 96926000, log_index: 81, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x20d2309cd92b797ae7ca175ed828ed8a27fbe29d", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 1, token_id: "105985080724064245114012949518165989083729807961896494806795246958083187261670", maker_amount_filled: "5000000", taker_amount_filled: "3650000", fee: "68980"}
          # Made up: a log of another event is left out.
          - {id: "96926000:82", event: ctf_exchange_v2.OrdersMatched, block_number: 96926000, log_index: 82, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x20d2309cd92b797ae7ca175ed828ed8a27fbe29d", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 1, token_id: "105985080724064245114012949518165989083729807961896494806795246958083187261670", maker_amount_filled: "5000000", taker_amount_filled: "3650000", fee: "0"}
    expect:
      rows:
        - {id: "96926000:78", is_taker_order: false, side: buy, price: "0.73000000000000000000"}
        - {id: "96926000:81", is_taker_order: true, side: sell, price: "0.73000000000000000000"}

  - name: outcome_tokens_follow_gamma_order
    description: >-
      Gamma market 6764951 (Task 1 proof row 2): outcomes ["Up", "Down"] and clobTokenIds in that order.
      Up is outcome 0 and Down outcome 1, each the other's complement. Event 1328177 comes from the
      staging test for the same market. A placeholder market with no clobTokenIds and the Protocol V2
      market 6770019 give no rows. A market with three outcomes has no complement.
    model: int_polymarket_outcome_tokens
    given:
      - input: ref('stg_polymarket__markets')
        format: sql
        rows: |
          select '6764951' as market_id, '0xcf28ea01af1aedbbb96bb3f2ed8efd5b4c52faaf057c98e59b118b75cc0afc6a' as condition_id,
              array['Up', 'Down'] as outcomes,
              array[56491295322642479574009649190264906678337478953962544953766149611910922990327, 103688884060883873727013522652996002941410548793093120456496990699655719191268]::numeric[] as clob_token_ids,
              '1328177' as event_id, false as neg_risk, 'v1' as protocol_version
          union all
          -- Made up: a placeholder neg-risk market has no condition and no tokens.
          select '0', null, array['Yes', 'No'], null::numeric[], null, true, 'v1'
          union all
          -- Protocol V2 market 6770019, left out because it is not v1.
          select '6770019', '0x012022213b0b69c791e46cd2665350ea69000000000000000000000000000000', array['Up', 'Down'],
              array[509087509928325909252543985009258432142384070580348294089705821985333837824, 509087509928325909252543985009258432142384070580348294089705821985333837825]::numeric[],
              '1329404', false, 'v2'
          union all
          -- Made up: a v1 market with three outcomes.
          select '1', '0x' || repeat('a', 64), array['A', 'B', 'C'], array[11, 12, 13]::numeric[], '2', false, 'v1'
    expect:
      rows:
        - {token_id: "56491295322642479574009649190264906678337478953962544953766149611910922990327", condition_id: "0xcf28ea01af1aedbbb96bb3f2ed8efd5b4c52faaf057c98e59b118b75cc0afc6a", outcome_index: 0, outcome: Up, complement_token_id: "103688884060883873727013522652996002941410548793093120456496990699655719191268", market_id: "6764951", event_id: "1328177", neg_risk: false, protocol: ctf}
        - {token_id: "103688884060883873727013522652996002941410548793093120456496990699655719191268", condition_id: "0xcf28ea01af1aedbbb96bb3f2ed8efd5b4c52faaf057c98e59b118b75cc0afc6a", outcome_index: 1, outcome: Down, complement_token_id: "56491295322642479574009649190264906678337478953962544953766149611910922990327", market_id: "6764951", event_id: "1328177", neg_risk: false, protocol: ctf}
        - {token_id: "11", condition_id: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", outcome_index: 0, outcome: A, complement_token_id: null, market_id: "1", event_id: "2", neg_risk: false, protocol: ctf}
        - {token_id: "12", condition_id: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", outcome_index: 1, outcome: B, complement_token_id: null, market_id: "1", event_id: "2", neg_risk: false, protocol: ctf}
        - {token_id: "13", condition_id: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", outcome_index: 2, outcome: C, complement_token_id: null, market_id: "1", event_id: "2", neg_risk: false, protocol: ctf}

  - name: resolved_proof_market_pays_its_winner
    description: >-
      Proof row 9: ctf.ConditionResolution of condition 0x21a7…ade3 at block 95573552, payoutNumerators
      [1, 0]. Gamma's reply for market 5681656 lists the same condition with outcomes ["Up", "Down"] and
      outcomePrices ["1", "0"], so Up, outcome 0, won. Up pays 1 and Down pays 0. A made-up all-zero vector gives null fractions.
    model: int_polygon_polymarket_ctf_resolutions
    given:
      - input: ref('stg_polygon__polymarket_ctf')
        format: sql
        rows: |
          select '95573552:698' as id, 'ctf.ConditionResolution' as event, 95573552::bigint as block_number,
              '2026-10-15 12:00:53+00'::timestamptz as block_timestamp, 698 as log_index,
              '0x21a77299dec1537c744abdbcb382c9e6b9d2386b8a495948f5745a336e8bade3' as condition_id,
              array[1, 0]::numeric[] as payout_numerators
          union all
          -- Made up: a log of another event is left out, even with a payout array.
          select '95573552:699', 'ctf.PositionSplit', 95573552, '2026-10-15 12:00:53+00'::timestamptz, 699,
              '0x21a77299dec1537c744abdbcb382c9e6b9d2386b8a495948f5745a336e8bade3', array[1, 1]::numeric[]
          union all
          -- Made up: a resolution that pays nothing has no fractions.
          select '95573553:1', 'ctf.ConditionResolution', 95573553, '2026-10-15 12:00:55+00'::timestamptz, 1,
              '0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', array[0, 0]::numeric[]
    expect:
      rows:
        - {condition_id: "0x21a77299dec1537c744abdbcb382c9e6b9d2386b8a495948f5745a336e8bade3", outcome_index: 0, payout_fraction: "1.00000000000000000000", resolved_block: 95573552, resolved_at: "2026-10-15 12:00:53+00"}
