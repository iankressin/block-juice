  - name: markets_prepared_before_coverage_are_incomplete
    description: >-
      The coverage start is the greater of the two raw tables' lowest blocks: the made-up ConditionPreparation
      at 96900000 in the CTF table, and proof row 3's fill at 96926007 in the exchange table. Proof row 19's
      condition (Gamma market 6826443) was prepared at 96926007, the coverage start itself, so it is
      complete. The made-up condition prepared at 96900000 is not, though it is the CTF table's first block.
      Proof row 20's ConditionResolution prepares nothing and gives no row.
    model: int_polygon_polymarket_ctf_conditions
    given:
      - input: ref('stg_polygon__polymarket_ctf')
        format: sql
        rows: &coverage_ctf |
          select * from (values
              ('96900000:1', 'ctf.ConditionPreparation', 96900000::bigint, '2026-11-07 12:44:16+00'::timestamptz, 1,
                  null::text, '0xaa', null::text, null::text),
              ('96926001:668', 'ctf.ConditionResolution', 96926001, '2026-11-07 23:34:18+00', 668,
                  '0xaf8b825dd4bf314a70cda0a6b989a4e166a8f03d2c6f67ddd704b98315f3c7b7',
                  '0x683a63b988e74667692fbe974c32eb04212aa24c64e7995adf89a37b64c23fac', '0xd91e80cf2e7be2e162c6513ced06f1dd0da35296', null),
              ('96926007:1235', 'ctf.ConditionPreparation', 96926007, '2026-11-07 23:34:27+00', 1235,
                  '0x4810bb0ec5850b073b08dc9d3765197020b43fd19a3a01d3a58cbfd9d820fd5b',
                  '0xf38448bdd650770b9bbbc27157cff1a0fbdbc3d75f581c9f2a1947c1411f659a', '0x65070be91477460d8a7aeeb94ef92fe056c2f2a7',
                  '0x082008a8e82194cdcbade3048ec3c123c8011e5bfe9b1db52f93e42eac1f9e5f')
          ) as l(id, event, block_number, block_timestamp, log_index, tx_hash, condition_id, oracle, question_id)
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926007:659", event: ctf_exchange_v2.OrderFilled, block_number: 96926007, log_index: 659}
