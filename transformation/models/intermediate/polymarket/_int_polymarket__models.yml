version: 2

models:
  - name: int_polygon_polymarket_ctf_exchange_v2_fills
    description: >-
      One row per order filled on the three CTF Exchange v2 contracts. Each match has a fill for every
      maker order and one more for the taker order. usdc is pUSD before fees; a buyer pays fee_usdc on
      top and a seller has it taken from usdc.
    config:
      contract:
        enforced: true
    columns:
      - name: id
        data_type: text
        description: The OrderFilled log's key from the raw table.
        data_tests: [unique, not_null]
      - name: version
        data_type: text
        description: Always ctf_exchange_v2.
      - name: exchange
        data_type: text
        description: The exchange contract that emitted the fill.
        data_tests: [not_null]
      - name: block_number
        data_type: bigint
        description: The block the fill was in.
      - name: block_timestamp
        data_type: timestamp with time zone
        description: When that block was mined.
      - name: tx_hash
        data_type: text
        description: The transaction the fill was in.
      - name: log_index
        data_type: integer
        description: The fill's position in that block's logs.
      - name: order_hash
        data_type: text
        description: The order this fill belongs to.
      - name: wallet
        data_type: text
        description: The order's maker, the proxy wallet or Safe that Polymarket shows as the trader.
        data_tests: [not_null]
      - name: counterparty
        data_type: text
        description: The taker field. It is the exchange itself on the taker order's fill.
      - name: is_taker_order
        data_type: boolean
        description: True for the taker order's own fill, whose taker is the exchange.
        data_tests: [not_null]
      - name: token_id
        data_type: numeric
        description: The outcome token the order traded.
        data_tests: [not_null]
      - name: side
        data_type: text
        description: buy or sell, for the wallet.
        data_tests: [not_null, accepted_values: {arguments: {values: [buy, sell]}}]
      - name: shares
        data_type: numeric
        description: Outcome tokens traded.
      - name: usdc
        data_type: numeric
        description: pUSD paid or received, before fees.
      - name: fee_usdc
        data_type: numeric
        description: The fee in pUSD.
      - name: price
        data_type: numeric
        description: usdc divided by shares.

unit_tests:
  - name: fills_of_a_buy_against_a_sell
    description: Proof row 1. The maker sells 5.106383 shares for 4.8 pUSD; the taker order buys them.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926000:403", event: OrderFilled, block_number: 96926000, tx_hash: "0x58f6ac1b129ebbf968d51fd5f66ed0563ee317b5b862e7c8f93bd4ab5e00ba30", log_index: 403, contract: "0xe111180000d2663c0091e4f400237545b87b996b", order_hash: "0xa1", maker: "0x1dd2a69e73ba444ecd5d87f0073d51a670ad51c2", taker: "0x8d220bbd98c5e47d9ae7781811cbba029cbaae40", side: 1, token_id: "21815194618493357610873019371928881814153899863038016502475197588875103719951", maker_amount_filled: "5106383", taker_amount_filled: "4800000", fee: "0"}
          - {id: "96926000:405", event: OrderFilled, block_number: 96926000, tx_hash: "0x58f6ac1b129ebbf968d51fd5f66ed0563ee317b5b862e7c8f93bd4ab5e00ba30", log_index: 405, contract: "0xe111180000d2663c0091e4f400237545b87b996b", order_hash: "0xa2", maker: "0x8d220bbd98c5e47d9ae7781811cbba029cbaae40", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 0, token_id: "21815194618493357610873019371928881814153899863038016502475197588875103719951", maker_amount_filled: "4800000", taker_amount_filled: "5106383", fee: "20160"}
    expect:
      rows:
        - {id: "96926000:403", version: ctf_exchange_v2, exchange: "0xe111180000d2663c0091e4f400237545b87b996b", wallet: "0x1dd2a69e73ba444ecd5d87f0073d51a670ad51c2", counterparty: "0x8d220bbd98c5e47d9ae7781811cbba029cbaae40", is_taker_order: false, token_id: "21815194618493357610873019371928881814153899863038016502475197588875103719951", side: sell, shares: "5.106383", usdc: "4.800000", fee_usdc: "0.000000", price: "0.93999999608333334965"}
        - {id: "96926000:405", version: ctf_exchange_v2, exchange: "0xe111180000d2663c0091e4f400237545b87b996b", wallet: "0x8d220bbd98c5e47d9ae7781811cbba029cbaae40", counterparty: "0xe111180000d2663c0091e4f400237545b87b996b", is_taker_order: true, token_id: "21815194618493357610873019371928881814153899863038016502475197588875103719951", side: buy, shares: "5.106383", usdc: "4.800000", fee_usdc: "0.020160", price: "0.93999999608333334965"}

  - name: fills_of_a_mint_match_are_two_buys
    description: >-
      Proof row 2. Both orders buy 8.71 shares, on the two outcomes of one condition. The prices add up
      to 1: 0.51 and 0.49.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926000:98", event: OrderFilled, block_number: 96926000, log_index: 98, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x3bfcd24e25e446d31eb4825b96b1ed515e36a199", taker: "0xe439b8e52eeeeda4eff19a10a4307706a85d61b4", side: 0, token_id: "103688884060883873727013522652996002941410548793093120456496990699655719191268", maker_amount_filled: "4442100", taker_amount_filled: "8710000", fee: "0"}
          - {id: "96926000:102", event: OrderFilled, block_number: 96926000, log_index: 102, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0xe439b8e52eeeeda4eff19a10a4307706a85d61b4", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 0, token_id: "56491295322642479574009649190264906678337478953962544953766149611910922990327", maker_amount_filled: "4267900", taker_amount_filled: "8710000", fee: "152360"}
    expect:
      rows:
        - {id: "96926000:98", is_taker_order: false, token_id: "103688884060883873727013522652996002941410548793093120456496990699655719191268", side: buy, shares: "8.710000", usdc: "4.442100", fee_usdc: "0.000000", price: "0.51000000000000000000"}
        - {id: "96926000:102", is_taker_order: true, token_id: "56491295322642479574009649190264906678337478953962544953766149611910922990327", side: buy, shares: "8.710000", usdc: "4.267900", fee_usdc: "0.152360", price: "0.49000000000000000000"}

  - name: fills_of_a_merge_match_are_two_sells
    description: >-
      Proof row 3. Both orders sell 4.47 shares, on the two outcomes of one condition. The prices add up
      to 1: 0.95 and 0.05.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926007:659", event: OrderFilled, block_number: 96926007, log_index: 659, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x200e9eb918a20e6baf5a60af14c65c9e4384e21d", taker: "0x7e7bc969274a14c241b66846fc699e9d0031afa2", side: 1, token_id: "58052577356328252628183651892588951427801085397945972476159165350688827473483", maker_amount_filled: "4470000", taker_amount_filled: "4246500", fee: "0"}
          - {id: "96926007:662", event: OrderFilled, block_number: 96926007, log_index: 662, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x7e7bc969274a14c241b66846fc699e9d0031afa2", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 1, token_id: "110891868994035549509428319985343688940098568959569462043345289006462020533224", maker_amount_filled: "4470000", taker_amount_filled: "223500", fee: "10610"}
    expect:
      rows:
        - {id: "96926007:659", is_taker_order: false, token_id: "58052577356328252628183651892588951427801085397945972476159165350688827473483", side: sell, shares: "4.470000", usdc: "4.246500", fee_usdc: "0.000000", price: "0.95000000000000000000"}
        - {id: "96926007:662", is_taker_order: true, token_id: "110891868994035549509428319985343688940098568959569462043345289006462020533224", side: sell, shares: "4.470000", usdc: "0.223500", fee_usdc: "0.010610", price: "0.05000000000000000000"}

  - name: fee_follows_q1
    description: >-
      Proof row 10. The seller got 5,497,250 = 5,500,000 - 2,750 and the buyer paid 5,500,000 + 271,970.
      The model keeps usdc before fees and the fee in its own column.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926003:333", event: OrderFilled, block_number: 96926003, log_index: 333, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x066dea1e1c12871afdffecd2c11cdf9636101bff", taker: "0x7e3a4d652e9ebd60ff54df022950ac736337130e", side: 1, token_id: "95925888873018679830803815086905784068229941729943579604241272453075308214452", maker_amount_filled: "500000000", taker_amount_filled: "5500000", fee: "2750"}
          - {id: "96926003:335", event: OrderFilled, block_number: 96926003, log_index: 335, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x7e3a4d652e9ebd60ff54df022950ac736337130e", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 0, token_id: "95925888873018679830803815086905784068229941729943579604241272453075308214452", maker_amount_filled: "5500000", taker_amount_filled: "500000000", fee: "271970"}
    expect:
      rows:
        - {id: "96926003:333", side: sell, shares: "500.000000", usdc: "5.500000", fee_usdc: "0.002750", price: "0.01100000000000000000"}
        - {id: "96926003:335", side: buy, shares: "500.000000", usdc: "5.500000", fee_usdc: "0.271970", price: "0.01100000000000000000"}

  - name: the_taker_order_is_marked
    description: Proof row 11. Only the fill whose taker is the exchange itself has is_taker_order true.
    model: int_polygon_polymarket_ctf_exchange_v2_fills
    given:
      - input: ref('stg_polygon__polymarket_ctf_exchange_v2')
        rows:
          - {id: "96926000:78", event: OrderFilled, block_number: 96926000, log_index: 78, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x3089fcf3fe5b67ec287654b4d627bcd1d51135e4", taker: "0x20d2309cd92b797ae7ca175ed828ed8a27fbe29d", side: 0, token_id: "105985080724064245114012949518165989083729807961896494806795246958083187261670", maker_amount_filled: "3650000", taker_amount_filled: "5000000", fee: "0"}
          - {id: "96926000:81", event: OrderFilled, block_number: 96926000, log_index: 81, contract: "0xe111180000d2663c0091e4f400237545b87b996b", maker: "0x20d2309cd92b797ae7ca175ed828ed8a27fbe29d", taker: "0xe111180000d2663c0091e4f400237545b87b996b", side: 1, token_id: "105985080724064245114012949518165989083729807961896494806795246958083187261670", maker_amount_filled: "5000000", taker_amount_filled: "3650000", fee: "68980"}
    expect:
      rows:
        - {id: "96926000:78", is_taker_order: false, side: buy, price: "0.73000000000000000000"}
        - {id: "96926000:81", is_taker_order: true, side: sell, price: "0.73000000000000000000"}
