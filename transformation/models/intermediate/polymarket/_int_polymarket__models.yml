    description: >-
      Proof row 9: ctf.ConditionResolution of condition 0x21a7…ade3 at block 95573552, payoutNumerators
      [1, 0]. Gamma's reply for market 5681656 lists the same condition with outcomes ["Up", "Down"] and
      outcomePrices ["1", "0"], so Up, outcome 0, won. Up pays 1 and Down pays 0. A made-up all-zero vector gives null fractions.
