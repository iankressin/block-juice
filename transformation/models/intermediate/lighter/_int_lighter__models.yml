  # The exit test uses the LLP's entries, their blocks and their batches as the Explorer sent them on
  # 2026-11-18 (catalog/vendors/lighter/NOTES.md, Account logs, L28 and L29).
  - name: an_exit_zeroes_the_position
    description: >-
      The LLP (281474976710654) left market 155 (MAGS) by an ExitPosition entry on 2026-06-10 and market 157
      (EDGE) by an ExitPositionWithFunding entry on 2026-10-28. Each gives an exit_position row in its
      market, with position_after 0 and a null amount, since the entry carries a settlement price but no
      amount. Block 259564659 sits in batch 187775, executed, and block 367828981 in batch 255445,
      nothing_to_execute.
    model: int_lighter_account_ledger
    given:
      - input: ref('stg_lighter__account_logs')
        format: sql
        rows: |
          select 281474976710654::bigint as account_index,
              '000000159f3bd92f0000019eb20a4f42000000000000000000000000000000000000000000000000'::text as hash,
              'InternalExitPosition'::text as tx_type, 'ExitPosition'::text as pubdata_type,
              '2026-06-10 14:58:00.642+00'::timestamptz as log_time, 'executed'::text as status,
              '{"account_index": "281474976710654", "market_index": 155, "settlement_price": "65.085"}'::jsonb as pubdata
          union all
          select 281474976710654,
              '00000020b1adc7f0000001a183013827000000000000000000000000000000000000000000000000',
              'InternalExitPosition', 'ExitPositionWithFunding', '2026-10-28 14:54:17.639+00', 'nothing_to_execute',
              '{"account_index": "281474976710654", "market_index": 157, "settlement_price": "0.33160", "funding_rate_prefix_sum": 6406364482}'
      - input: ref('stg_lighter__account_log_details')
        format: sql
        rows: |
          select '000000159f3bd92f0000019eb20a4f42000000000000000000000000000000000000000000000000'::text as hash,
              259564659::bigint as block_number
          union all
          select '00000020b1adc7f0000001a183013827000000000000000000000000000000000000000000000000', 367828981
      - input: ref('lighter_account_movements')
        format: sql
        rows: *no_ledger_movements
      - input: ref('lighter_account_fills')
        format: sql
        rows: &no_ledger_fills |
          select null::text as id, null::bigint as trade_id, null::timestamptz as trade_time, null::integer as market_id,
              null::bigint as account_index, null::text as role, null::numeric as fee_usdc, null::numeric as position_after,
              null::numeric as realized_pnl
          where false
      - input: ref('lighter_markets')
        rows:
          - {market_id: 0, symbol: ETH, market_type: perp}
      - input: ref('lighter_trades')
        format: sql
        rows: &no_ledger_trades |
          select null::bigint as trade_id, null::bigint as block_number, null::text as tx_hash,
              null::numeric as integrator_maker_fee_usdc, null::numeric as integrator_taker_fee_usdc
          where false
      - input: ref('lighter_batches')
        rows:
          - {batch_number: 187775, first_block: 259564112, last_block: 259565711, status: executed, execute_tx_hash: "0x8e3770fc21ad39fd36d94e44f19f3e3e2e5cdd0b88b7fa751bddaff665a83844", executed_at: "2026-06-10 16:13:35+00"}
          - {batch_number: 255445, first_block: 367828613, last_block: 367830212, status: nothing_to_execute}
      - input: ref('int_lighter_funding_payments')
        format: sql
        rows: *no_funding
    expect:
      rows:
        - {id: "exit:000000159f3bd92f0000019eb20a4f42000000000000000000000000000000000000000000000000:281474976710654", account_index: 281474976710654, kind: exit_position, amount: null, market_id: 155, position_after: 0, block_number: 259564659, batch_number: 187775, batch_status: executed, execute_tx_hash: "0x8e3770fc21ad39fd36d94e44f19f3e3e2e5cdd0b88b7fa751bddaff665a83844"}
        - {id: "exit:00000020b1adc7f0000001a183013827000000000000000000000000000000000000000000000000:281474976710654", account_index: 281474976710654, kind: exit_position, amount: null, market_id: 157, position_after: 0, block_number: 367828981, batch_number: 255445, batch_status: nothing_to_execute, execute_tx_hash: null}

  - name: cumulative_amount_runs_per_account_asset_and_route
    description: >-
      313004 deposits 35 USDC onto perps (its L1Deposit of 2025-11-12), then 5 onto spot, then withdraws 10
      from perps. The perps total runs 35, then 25; the spot deposit starts a total of its own, 5.
    model: int_lighter_account_ledger
    given:
      - input: ref('stg_lighter__account_logs')
        rows:
          - {account_index: 313004}
      - input: ref('stg_lighter__account_log_details')
        format: sql
        rows: *no_ledger_details
      - input: ref('lighter_account_movements')
        rows:
          - {id: "a:313004:self", hash: a, log_time: "2025-11-12 05:32:11.513606+00", account_index: 313004, kind: deposit, asset: USDC, route: perps, signed_amount: 35}
          - {id: "b:313004:self", hash: b, log_time: "2025-11-13 00:00:00+00", account_index: 313004, kind: deposit, asset: USDC, route: spot, signed_amount: 5}
          - {id: "c:313004:self", hash: c, log_time: "2025-11-14 00:00:00+00", account_index: 313004, kind: withdrawal, asset: USDC, route: perps, signed_amount: -10}
      - input: ref('lighter_account_fills')
        format: sql
        rows: *no_ledger_fills
      - input: ref('lighter_markets')
        rows:
          - {market_id: 0, symbol: ETH, market_type: perp}
      - input: ref('lighter_trades')
        format: sql
        rows: *no_ledger_trades
      - input: ref('lighter_batches')
        format: sql
        rows: &no_ledger_batches |
          select null::bigint as batch_number, null::bigint as first_block, null::bigint as last_block,
              null::text as status, null::text as execute_tx_hash, null::timestamptz as executed_at
          where false
      - input: ref('int_lighter_funding_payments')
        format: sql
        rows: *no_funding
    expect:
      rows:
        - {id: "move:a:313004:self", kind: deposit, route: perps, amount: 35, cumulative_amount: 35}
        - {id: "move:b:313004:self", kind: deposit, route: spot, amount: 5, cumulative_amount: 5}
        - {id: "move:c:313004:self", kind: withdrawal, route: perps, amount: -10, cumulative_amount: 25}
