  # The funding test uses ETH's hourly values of 2026-11-17 from lighter_funding_rates, 313004's fill in
  # trade 40969901633, and the sign rule of catalog/vendors/lighter/NOTES.md, Funding prefix sums (L21): the
  # side that direction names pays. The other fills are made up around them.
  - name: funding_is_position_times_value_signed_by_direction
    description: >-
      ETH's value at 13:00 on 2026-11-17 was 0.01641159, direction long. 313004's fill at 12:16:48 left it
      long 0.7863, so it pays 0.7863 × 0.01641159: -0.012904433217. 693073's first ETH fill comes at 15:30,
      after its BTC fill at 12:16, so at 13:00 it holds that fill's position_before, short 1.2821, and
      receives 0.021041299539. At 16:00 the value was 0.00535704, direction short: 313004 still holds 0.7863
      and receives 0.004212240552, and 693073 closed at 15:30, so it has no row. No BTC value is given, so
      693073's BTC position has no row either.
    model: int_lighter_funding_payments
    given:
      - input: ref('stg_lighter__account_logs')
        rows:
          - {account_index: 313004}
          - {account_index: 693073}
      - input: ref('lighter_account_fills')
        rows:
          - {id: "40969901633:taker", trade_id: 40969901633, trade_time: "2026-11-17 12:16:48.698+00", market_id: 0, account_index: 313004, position_before: 0.7974, position_after: 0.7863}
          - {id: "2:maker", trade_id: 2, trade_time: "2026-11-17 12:16:53+00", market_id: 1, account_index: 693073, position_before: 0, position_after: 0.01}
          - {id: "3:taker", trade_id: 3, trade_time: "2026-11-17 15:30:00+00", market_id: 0, account_index: 693073, position_before: -1.2821, position_after: 0}
      - input: ref('lighter_markets')
        rows:
          - {market_id: 0, symbol: ETH, market_type: perp}
          - {market_id: 1, symbol: BTC, market_type: perp}
      - input: ref('lighter_trades')
        rows:
          - {trade_id: 3, trade_time: "2026-11-17 15:30:00+00"}
      - input: ref('lighter_funding_rates')
        rows:
          - {id: "0:1794920400", market_id: 0, symbol: ETH, funding_time: "2026-11-17 13:00:00+00", value_usdc_per_unit: 0.01641159, direction: long}
          - {id: "0:1794931200", market_id: 0, symbol: ETH, funding_time: "2026-11-17 16:00:00+00", value_usdc_per_unit: 0.00535704, direction: short}
    expect:
      rows:
        - {account_index: 313004, market_id: 0, funding_time: "2026-11-17 13:00:00+00", position: 0.7863, value_usdc_per_unit: 0.01641159, direction: long, amount: -0.012904433217}
        - {account_index: 693073, market_id: 0, funding_time: "2026-11-17 13:00:00+00", position: -1.2821, value_usdc_per_unit: 0.01641159, direction: long, amount: 0.021041299539}
        - {account_index: 313004, market_id: 0, funding_time: "2026-11-17 16:00:00+00", position: 0.7863, value_usdc_per_unit: 0.00535704, direction: short, amount: 0.004212240552}

  # A break in the fill chain: lighter_account_fills holds only the trades lighter-trades loads, so an account
  # it does not load in full has gaps. 313004's fill at 12:16:48 is real; the rest are made up around it.
  - name: a_break_in_the_fill_chain_drops_the_hours_it_hides
    description: >-
      313004's fill at 12:16:48 leaves it long 0.7863, but its next fill, at 15:30, starts from 1.5, so trades
      between them are not loaded and its position at 13:00 and 14:00 is unknown: those hours have no row.
      At 16:00 it holds that fill's 1.2 and receives 0.006428448 (value 0.00535704, short). 693073's chain
      holds, short 1.2821 from 12:16 to 15:30, so it receives at 13:00 (0.021041299539) and 14:00
      (value 0.01280559, long: 0.016418046939), and pays 0.00535704 on its short 1 at 16:00.
    model: int_lighter_funding_payments
    given:
      - input: ref('stg_lighter__account_logs')
        rows:
          - {account_index: 313004}
          - {account_index: 693073}
      - input: ref('lighter_account_fills')
        rows:
          - {id: "40969901633:taker", trade_id: 40969901633, trade_time: "2026-11-17 12:16:48.698+00", market_id: 0, account_index: 313004, position_before: 0.7974, position_after: 0.7863}
          - {id: "4:taker", trade_id: 4, trade_time: "2026-11-17 15:30:00+00", market_id: 0, account_index: 313004, position_before: 1.5, position_after: 1.2}
          - {id: "5:maker", trade_id: 5, trade_time: "2026-11-17 12:16:53+00", market_id: 0, account_index: 693073, position_before: 0, position_after: -1.2821}
          - {id: "6:maker", trade_id: 6, trade_time: "2026-11-17 15:30:00+00", market_id: 0, account_index: 693073, position_before: -1.2821, position_after: -1}
      - input: ref('lighter_markets')
        rows:
          - {market_id: 0, symbol: ETH, market_type: perp}
      - input: ref('lighter_trades')
        rows:
          - {trade_id: 6, trade_time: "2026-11-17 15:30:00+00"}
      - input: ref('lighter_funding_rates')
        rows:
          - {id: "0:1794920400", market_id: 0, symbol: ETH, funding_time: "2026-11-17 13:00:00+00", value_usdc_per_unit: 0.01641159, direction: long}
          - {id: "0:1794924000", market_id: 0, symbol: ETH, funding_time: "2026-11-17 14:00:00+00", value_usdc_per_unit: 0.01280559, direction: long}
          - {id: "0:1794931200", market_id: 0, symbol: ETH, funding_time: "2026-11-17 16:00:00+00", value_usdc_per_unit: 0.00535704, direction: short}
    expect:
      rows:
        - {account_index: 313004, funding_time: "2026-11-17 16:00:00+00", position: 1.2, amount: 0.006428448}
        - {account_index: 693073, funding_time: "2026-11-17 13:00:00+00", position: -1.2821, amount: 0.021041299539}
        - {account_index: 693073, funding_time: "2026-11-17 14:00:00+00", position: -1.2821, amount: 0.016418046939}
        - {account_index: 693073, funding_time: "2026-11-17 16:00:00+00", position: -1, amount: -0.00535704}

