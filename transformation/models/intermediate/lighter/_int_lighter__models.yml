version: 2

unit_tests:
  - name: int_lighter_markets_keeps_the_latest_reading
    description: >-
      Market 0 is read at two times. Its size_decimals is 4 in the first reading and 5 in the second,
      so the one row left holds 5.
    model: int_lighter_markets
    given:
      - input: ref('stg_lighter__markets')
        rows:
          - {id: "0:1794918000000", market_id: 0, symbol: ETH, read_at: "2026-11-17 11:00:00+00", size_decimals: 4}
          - {id: "0:1795004400000", market_id: 0, symbol: ETH, read_at: "2026-11-18 11:00:00+00", size_decimals: 5}
    expect:
      rows:
        - {market_id: 0, symbol: ETH, size_decimals: 5}

  - name: funding_rate_is_signed_by_direction
    description: >-
      ETH at 2026-10-17 07:00 UTC paid 0.0005 percent with direction long, so its signed rate is
      0.0005. The next hour is a short row of 0.0003, so its signed rate is -0.0003.
    model: int_lighter_funding_rates
    given:
      - input: ref('stg_lighter__fundings')
        rows:
          - {id: "0:1792220400", market_id: 0, symbol: ETH, funding_time: "2026-10-17 07:00:00+00", rate_pct: 0.0005, value_usdc_per_unit: 0.01216590, direction: long}
          - {id: "0:1792224000", market_id: 0, symbol: ETH, funding_time: "2026-10-17 08:00:00+00", rate_pct: 0.0003, value_usdc_per_unit: 0.00730000, direction: short}
    expect:
      rows:
        - {id: "0:1792220400", market_id: 0, symbol: ETH, funding_time: "2026-10-17 07:00:00+00", rate_pct: 0.0005, signed_rate_pct: 0.0005, value_usdc_per_unit: 0.01216590, direction: long}
        - {id: "0:1792224000", market_id: 0, symbol: ETH, funding_time: "2026-10-17 08:00:00+00", rate_pct: 0.0003, signed_rate_pct: -0.0003, value_usdc_per_unit: 0.00730000, direction: short}

  # The int_lighter_trades tests use real trades: 40627877458 from catalog/vendors/lighter/NOTES.md (Units,
  # P1, P9), and 40827970887 and 40839017087 from the API reply P9 compares with S3.
  - name: size_and_price_scale_by_the_market_decimals
    description: >-
      Trade 40627877458 is ETH (slot 0), whose size and price carry 4 and 2 decimals. size 3491, price
      181952 and usdc_amount 635194432 give 0.3491 at 1819.52 for 635.194432 USDC. The maker held
      -2252 before it, so -0.2252 ETH, and the taker held 0.
    model: int_lighter_trades
    given:
      - input: ref('stg_lighter__trades')
        rows:
          - {trade_id: 40627877458, slot_market_id: 0, public_market_index: 0, size_raw: 3491, price_raw: 181952, usdc_amount_raw: 635194432, maker_position_size_before_raw: -2252, taker_position_size_before_raw: 0}
      - input: ref('int_lighter_markets')
        rows: &lighter_markets
          - {market_id: 0, symbol: ETH, market_type: perp, size_decimals: 4, price_decimals: 2, quote_decimals: 6}
          - {market_id: 51, symbol: RESOLV, market_type: perp, size_decimals: 0, price_decimals: 6, quote_decimals: 6}
          - {market_id: 4097, symbol: PRL, market_type: perp, size_decimals: 2, price_decimals: 4, quote_decimals: 6}
    expect:
      rows:
        - {trade_id: 40627877458, size: 0.3491, price: 1819.52, notional_usdc: 635.194432, maker_position_before: -0.2252, taker_position_before: 0}

  - name: market_id_is_the_public_index_when_set
    description: >-
      Lighter reuses slot 51. On 2026-11-16 it traded PRL, public id 4097. Before 2026-08-20 the file
      has no public id, and slot 51 was RESOLV, public id 51.
    model: int_lighter_trades
    given:
      - input: ref('stg_lighter__trades')
        rows:
          - {trade_id: 1, slot_market_id: 51, public_market_index: 4097}
          - {trade_id: 2, slot_market_id: 51, public_market_index: null}
      - input: ref('int_lighter_markets')
        rows: *lighter_markets
    expect:
      rows:
        - {trade_id: 1, market_id: 4097, slot_market_id: 51, symbol: PRL}
        - {trade_id: 2, market_id: 51, slot_market_id: 51, symbol: RESOLV}

  - name: the_maker_is_the_ask_when_is_maker_ask
    description: >-
      Trade 40627877458 has is_maker_ask true, so 757337, the ask, is the maker and 313004, the bid,
      the taker, who buys. Trade 40827970887 has it false, so the bid is the maker and 757337, the ask,
      the taker, who sells.
    model: int_lighter_trades
    given:
      - input: ref('stg_lighter__trades')
        rows:
          - {trade_id: 40627877458, slot_market_id: 0, public_market_index: 0, is_maker_ask: true, ask_account_id: 757337, bid_account_id: 313004}
          - {trade_id: 40827970887, slot_market_id: 110, public_market_index: 110, is_maker_ask: false, ask_account_id: 757337, bid_account_id: 281474976483190}
      - input: ref('int_lighter_markets')
        rows: *lighter_markets
    expect:
      rows:
        - {trade_id: 40627877458, maker_account_index: 757337, taker_account_index: 313004, taker_side: buy, ask_account_index: 757337, bid_account_index: 313004}
        - {trade_id: 40827970887, maker_account_index: 281474976483190, taker_account_index: 757337, taker_side: sell, ask_account_index: 757337, bid_account_index: 281474976483190}

  - name: fees_are_parts_per_million_of_notional
    description: >-
      Trade 40627877458 pays its maker 50 parts per million of 635.194432 USDC, so 0.0317597216 USDC,
      and its integrator 250, so 0.158798608 USDC.
    model: int_lighter_trades
    given:
      - input: ref('stg_lighter__trades')
        rows:
          - {trade_id: 40627877458, slot_market_id: 0, public_market_index: 0, usdc_amount_raw: 635194432, maker_fee_raw: 50, integrator_maker_fee_raw: 250}
      - input: ref('int_lighter_markets')
        rows: *lighter_markets
    expect:
      rows:
        - {trade_id: 40627877458, maker_fee_ppm: 50, maker_fee_usdc: 0.0317597216, integrator_maker_fee_usdc: 0.158798608}

  - name: pnl_and_entry_quotes_are_usdc_times_10_to_the_6
    description: >-
      Trade 40839017087 (US100) closed 757337's short as the bid. The API sends its pnl as -0.439630
      and its entry quote before as 1194.870377, which the file holds times 10^6 (NOTES.md, P9).
    model: int_lighter_trades
    given:
      - input: ref('stg_lighter__trades')
        rows:
          - {trade_id: 40839017087, slot_market_id: 181, public_market_index: 181, ask_account_pnl_raw: null, bid_account_pnl_raw: -439630, maker_entry_quote_before_raw: 0, taker_entry_quote_before_raw: 1194870377}
      - input: ref('int_lighter_markets')
        rows: *lighter_markets
    expect:
      rows:
        - {trade_id: 40839017087, ask_account_pnl: null, bid_account_pnl: -0.43963, maker_entry_quote_before_usdc: 0, taker_entry_quote_before_usdc: 1194.870377}

  # The int_lighter_account_fills tests use trade 40627877458 (catalog/vendors/lighter/NOTES.md, Units, P9).
  - name: a_trade_gives_a_maker_row_and_a_taker_row
    description: >-
      Trade 40627877458 has is_maker_ask true. So 757337, the ask, is the maker and sells 0.3491, and
      313004, the bid, is the taker and buys 0.3491. Each row takes the fee and pnl of its own role and side.
    model: int_lighter_account_fills
    given:
      - input: ref('int_lighter_trades')
        rows:
          - {trade_id: 40627877458, market_id: 0, symbol: ETH, size: 0.3491, is_maker_ask: true, maker_account_index: 757337, taker_account_index: 313004, ask_account_index: 757337, bid_account_index: 313004, maker_fee_ppm: 50, taker_fee_ppm: 200, maker_fee_usdc: 0.0317597216, taker_fee_usdc: 0.1270388864, ask_account_pnl: 1.5, bid_account_pnl: null}
    expect:
      rows:
        - {id: "40627877458:maker", trade_id: 40627877458, account_index: 757337, role: maker, side: sell, signed_size: -0.3491, fee_ppm: 50, fee_usdc: 0.0317597216, realized_pnl: 1.5}
        - {id: "40627877458:taker", trade_id: 40627877458, account_index: 313004, role: taker, side: buy, signed_size: 0.3491, fee_ppm: 200, fee_usdc: 0.1270388864, realized_pnl: null}

  - name: a_bid_maker_buys_and_the_ask_taker_sells
    description: >-
      With is_maker_ask false the maker is the bid and buys 2, and the taker is the ask and sells 2.
      Each row takes its own role's fee and its own side's pnl: the maker the bid pnl, the taker the ask pnl.
    model: int_lighter_account_fills
    given:
      - input: ref('int_lighter_trades')
        rows:
          - {trade_id: 8, market_id: 0, symbol: ETH, size: 2, is_maker_ask: false, maker_account_index: 313004, taker_account_index: 757337, ask_account_index: 757337, bid_account_index: 313004, maker_fee_ppm: 50, taker_fee_ppm: 200, maker_fee_usdc: 0.5, taker_fee_usdc: 2, ask_account_pnl: 3, bid_account_pnl: -4}
    expect:
      rows:
        - {id: "8:maker", account_index: 313004, role: maker, side: buy, signed_size: 2, fee_ppm: 50, fee_usdc: 0.5, realized_pnl: -4}
        - {id: "8:taker", account_index: 757337, role: taker, side: sell, signed_size: -2, fee_ppm: 200, fee_usdc: 2, realized_pnl: 3}

  - name: position_after_adds_the_signed_size
    description: >-
      The taker held 0 and buys 0.3491, so it holds 0.3491. The maker held -0.2252 ETH and sells 0.3491,
      so it goes from -0.2252 to -0.5743.
    model: int_lighter_account_fills
    given:
      - input: ref('int_lighter_trades')
        rows:
          - {trade_id: 40627877458, market_id: 0, symbol: ETH, size: 0.3491, is_maker_ask: true, maker_account_index: 757337, taker_account_index: 313004, ask_account_index: 757337, bid_account_index: 313004, maker_position_before: -0.2252, taker_position_before: 0}
    expect:
      rows:
        - {id: "40627877458:maker", position_before: -0.2252, position_after: -0.5743}
        - {id: "40627877458:taker", position_before: 0, position_after: 0.3491}

  - name: a_side_with_no_account_has_no_row
    description: >-
      A market-settlement trade has ask account 281474976710655, which means no account. Only the bid
      side keeps a row.
    model: int_lighter_account_fills
    given:
      - input: ref('int_lighter_trades')
        rows:
          - {trade_id: 7, market_id: 0, symbol: ETH, size: 1, is_maker_ask: false, maker_account_index: 313004, taker_account_index: 281474976710655, ask_account_index: 281474976710655, bid_account_index: 313004, maker_position_before: 2, taker_position_before: 0}
    expect:
      rows:
        - {id: "7:maker", account_index: 313004, role: maker, side: buy, signed_size: 1, position_before: 2, position_after: 3}

  # The int_lighter_batches tests use batches read from the Explorer on 2026-11-18 (catalog/vendors/lighter/NOTES.md,
  # Batches and L1 settlement, L11 and L12). Each lists only the blocks the test needs, as the Explorer sent them.
  - name: l1_times_come_from_status_changes
    description: >-
      Batch 270062 was committed at 11:54:23, verified at 12:08:59 and executed at 12:08:59 on 2026-11-17,
      so it is executed and final. Its last two changes share a second; executed comes later in the list.
      Batch 270064 was committed at 11:56:59 and went to nothing_to_execute at 12:14:35 with its verify
      hash, so it was verified then, has no execute time, and is final.
    model: int_lighter_batches
    given:
      - input: ref('stg_lighter__batches')
        format: sql
        rows: |
          select 270062::bigint as batch_number, '2026-11-17 12:10:37.866067+00'::timestamptz as updated_at,
              '0x50f0e5aa336f09405d3e264af44cbb4138f53b89b7beb7b23ecf1e6103f84316'::text as commit_tx_hash,
              '0x9b84cad69e96774aee9ebfe6a47ddc2a98c505e439c7513ea2fb67ce371ff596'::text as verify_tx_hash,
              '0x3da459769fb33f0b08709dafc6eae310f27ad43e16570bb7e6ddacc2014ba4da'::text as execute_tx_hash,
              '[{"block_number": 391215230, "updated_at": "2026-11-17T11:45:05.194692Z", "total_transactions": 500}]'::jsonb as blocks,
              '[{"hash": "0x50f0e5aa336f09405d3e264af44cbb4138f53b89b7beb7b23ecf1e6103f84316", "updated_at": "2026-11-17T11:54:23Z", "batch_status": "committed"},
                {"hash": "0x9b84cad69e96774aee9ebfe6a47ddc2a98c505e439c7513ea2fb67ce371ff596", "updated_at": "2026-11-17T12:08:59Z", "batch_status": "verified"},
                {"hash": "0x3da459769fb33f0b08709dafc6eae310f27ad43e16570bb7e6ddacc2014ba4da", "updated_at": "2026-11-17T12:08:59Z", "batch_status": "executed"}]'::jsonb as status_changes
          union all
          select 270064, '2026-11-17 12:16:14.557425+00',
              '0x06461478d7061e4b3fde59e26cbe32a5626587fcc0b2ec2654fc98f8880a6b9a',
              '0xc09974b4a796e325d06987f2d05ce614452ff2e276d68dfaa1246acb89ce91a6',
              null,
              '[{"block_number": 391218430, "updated_at": "2026-11-17T11:47:40.899007Z", "total_transactions": 500}]',
              '[{"hash": "0x06461478d7061e4b3fde59e26cbe32a5626587fcc0b2ec2654fc98f8880a6b9a", "updated_at": "2026-11-17T11:56:59Z", "batch_status": "committed"},
                {"hash": "0xc09974b4a796e325d06987f2d05ce614452ff2e276d68dfaa1246acb89ce91a6", "updated_at": "2026-11-17T12:14:35Z", "batch_status": "nothing_to_execute"}]'
    expect:
      rows:
        - {batch_number: 270062, status: executed, is_final: true, committed_at: "2026-11-17 11:54:23+00", verified_at: "2026-11-17 12:08:59+00", executed_at: "2026-11-17 12:08:59+00", final_at: "2026-11-17 12:08:59+00"}
        - {batch_number: 270064, status: nothing_to_execute, is_final: true, committed_at: "2026-11-17 11:56:59+00", verified_at: "2026-11-17 12:14:35+00", executed_at: null, final_at: "2026-11-17 12:14:35+00"}

  - name: a_new_batch_is_pending
    description: >-
      Batch 270105, read at 13:14 on 2026-11-17 before its commit, had batch_details {} and no status
      changes, so it is pending and not final. Batch 28910, the first the Explorer holds, has batch_details
      null and no status changes: it is pending too, and never settles.
    model: int_lighter_batches
    given:
      - input: ref('stg_lighter__batches')
        format: sql
        rows: |
          -- updated_at is made up: the 13:14 reply's was not kept.
          select 270105::bigint as batch_number, '2026-11-17 13:14:00+00'::timestamptz as updated_at,
              null::text as commit_tx_hash, null::text as verify_tx_hash, null::text as execute_tx_hash,
              '[{"block_number": 391284030, "updated_at": "2026-11-17T13:06:33.150264Z", "total_transactions": 500}]'::jsonb as blocks,
              '[]'::jsonb as status_changes
          union all
          select 28910, '2025-08-25 16:20:38.646202+00', null, null, null,
              '[{"block_number": 41849406, "updated_at": "2025-08-25T15:28:03.691073Z", "total_transactions": 498}]',
              '[]'
    expect:
      rows:
        - {batch_number: 270105, status: pending, is_final: false, commit_tx_hash: null, committed_at: null, verified_at: null, executed_at: null, final_at: null}
        - {batch_number: 28910, status: pending, is_final: false, commit_tx_hash: null, committed_at: null, verified_at: null, executed_at: null, final_at: null}

  - name: block_range_and_counts_come_from_the_block_list
    description: >-
      The first three blocks of batch 270063, 391216830 (500 txs), 391216831 (477) and 391216832 (500), give
      a range of 391216830 to 391216832, 3 blocks and 1477 txs. The first block's time keeps its microseconds.
    model: int_lighter_batches
    given:
      - input: ref('stg_lighter__batches')
        format: sql
        rows: |
          select 270063::bigint as batch_number, '2026-11-17 12:11:01.993887+00'::timestamptz as updated_at,
              null::text as commit_tx_hash, null::text as verify_tx_hash, null::text as execute_tx_hash,
              '[{"block_number": 391216830, "updated_at": "2026-11-17T11:46:13.256136Z", "total_transactions": 500},
                {"block_number": 391216831, "updated_at": "2026-11-17T11:46:13.300811Z", "total_transactions": 477},
                {"block_number": 391216832, "updated_at": "2026-11-17T11:46:13.340002Z", "total_transactions": 500}]'::jsonb as blocks,
              '[]'::jsonb as status_changes
    expect:
      rows:
        - {batch_number: 270063, first_block: 391216830, last_block: 391216832, block_count: 3, tx_count: 1477, first_block_time: "2026-11-17 11:46:13.256136+00", last_block_time: "2026-11-17 11:46:13.340002+00"}
