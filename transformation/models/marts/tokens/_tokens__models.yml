version: 2

models:
  - name: tokens
    description: >-
      Each token's latest name, symbol and decimals, one row per chain and token in evm-erc20-metadata's
      addresses.json. Symbols are not unique, even on one chain, so key on chain and token, never on symbol.
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || token"
    columns:
      - name: chain
        description: Which chain the token lives on.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum, arbitrum, base]
      - name: token
        description: The token's contract address, lowercased.
        data_tests: [not_null]
      - name: name
        description: >-
          What name() returned, as text. A bytes32 reply is decoded too, without its zero bytes. Null when
          name() reverted or returned nothing.
      - name: symbol
        description: >-
          What symbol() returned, as text, decoded like name. Null when symbol() reverted or returned
          nothing. Two tokens can share a symbol.
      - name: decimals
        description: >-
          What decimals() returned. Null means the contract has no decimals(), which ERC-20 allows; never
          assume 18.
      - name: block_number
        description: The block this reading was taken at.

unit_tests:
  - name: the_latest_metadata_reading_wins
    description: >-
      Made up: three readings of one token, one at an earlier block and two at a later block, loaded one
      after another. The mart keeps the reading at the latest block, and of the two there, the one loaded
      last.
    model: tokens
    given:
      - input: ref('int_ethereum_erc20_metadata')
        rows:
          - {chain: ethereum, token: "0x00000000000000000000000000000000000000cc", name: First, symbol: ONE, decimals: 6, block_number: 100, _loaded_at: "2026-11-01 00:00:00+00"}
          - {chain: ethereum, token: "0x00000000000000000000000000000000000000cc", name: Second, symbol: TWO, decimals: 6, block_number: 200, _loaded_at: "2026-11-02 00:00:00+00"}
          - {chain: ethereum, token: "0x00000000000000000000000000000000000000cc", name: Third, symbol: THREE, decimals: 6, block_number: 200, _loaded_at: "2026-11-03 00:00:00+00"}
      - input: ref('int_arbitrum_erc20_metadata')
        rows: []
      - input: ref('int_base_erc20_metadata')
        rows: []
    expect:
      rows:
        - {chain: ethereum, token: "0x00000000000000000000000000000000000000cc", name: Third, symbol: THREE, block_number: 200}
