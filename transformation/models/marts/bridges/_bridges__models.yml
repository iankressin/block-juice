version: 2

models:
  - name: bridge_transfers
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || id"
    columns:
      - name: direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [to_ethereum, from_ethereum]
      - name: l2_address
        data_tests: [not_null]
      - name: ethereum_address
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
  - name: bridge_pairs
    data_tests:
      - unique:
          arguments:
            column_name: "from_chain || ':' || withdrawal_id"
      - unique:
          arguments:
            column_name: "to_chain || ':' || deposit_id"
    columns:
      - name: withdrawal_id
        data_tests: [not_null]
      - name: deposit_id
        data_tests: [not_null]

unit_tests:
  - name: a_late_deposit_of_the_same_amount_pairs
    description: >-
      A pair read on Portal: 716990784284181798845975 base units of the Ethereum token 0x607f451f left
      Arbitrum through the L2 ERC20 gateway on 2026-09-25 and reached Base on 2026-10-02 through 0x8100, 157
      hours later. A deposit of another amount, one too soon after its withdrawal, and one on the same chain
      do not pair.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: arbitrum, id: "508746303:6", direction: to_ethereum, l2_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: "716990784284181798845975", block_timestamp: "2026-09-25 11:19:50+00"}
          - {chain: base, id: "52056280:3", direction: from_ethereum, l2_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: "716990784284181798845975", block_timestamp: "2026-10-02 00:45:07+00"}
          - {chain: base, id: "2:1", direction: from_ethereum, l2_address: "0xaa", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: 5, block_timestamp: "2026-10-20 00:00:00+00"}
          - {chain: arbitrum, id: "3:1", direction: to_ethereum, l2_address: "0xbb", ethereum_address: "0xcc", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: 7, block_timestamp: "2026-10-10 00:00:00+00"}
          - {chain: base, id: "4:1", direction: from_ethereum, l2_address: "0xdd", ethereum_address: "0xcc", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: 7, block_timestamp: "2026-10-12 00:00:00+00"}
          - {chain: arbitrum, id: "5:1", direction: to_ethereum, l2_address: "0xee", ethereum_address: "0xff", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: 9, block_timestamp: "2026-10-01 00:00:00+00"}
          - {chain: arbitrum, id: "6:1", direction: from_ethereum, l2_address: "0xee", ethereum_address: "0xff", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: 9, block_timestamp: "2026-10-20 00:00:00+00"}
    expect:
      rows:
        - {from_chain: arbitrum, from_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", to_chain: base, to_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", withdrawal_id: "508746303:6", deposit_id: "52056280:3", candidates: 1}

  - name: an_earlier_unpaired_deposit_blocks_no_later_pair
    description: >-
      A deposit into Base paid from other funds comes before any withdrawal. It takes no withdrawal and
      leaves the next one free: the Arbitrum withdrawal of Oct 1, ready Oct 7, pays for the deposit of Oct 9.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: base, id: "1:1", direction: from_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-09-20 00:00:00+00"}
          - {chain: arbitrum, id: "10:1", direction: to_ethereum, l2_address: "0xa1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-01 00:00:00+00"}
          - {chain: base, id: "2:1", direction: from_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-09 00:00:00+00"}
    expect:
      rows:
        - {from_chain: arbitrum, withdrawal_id: "10:1", to_chain: base, deposit_id: "2:1", candidates: 1}

  - name: the_withdrawal_ready_first_pays_first
    description: >-
      The Base withdrawal of Oct 2 is ready on Oct 3, before the Arbitrum one of Oct 1 is ready on Oct 7, so
      it pays for the first deposit: the Arbitrum deposit at the exact time it became ready. The Arbitrum
      withdrawal pays for the next deposit, into Base.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: arbitrum, id: "10:1", direction: to_ethereum, l2_address: "0xa1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-01 00:00:00+00"}
          - {chain: base, id: "1:1", direction: to_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-02 00:00:00+00"}
          - {chain: arbitrum, id: "11:1", direction: from_ethereum, l2_address: "0xa1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-03 00:00:00+00"}
          - {chain: base, id: "2:1", direction: from_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-09 00:00:00+00"}
    expect:
      rows:
        - {from_chain: base, withdrawal_id: "1:1", to_chain: arbitrum, deposit_id: "11:1", candidates: 1}
        - {from_chain: arbitrum, withdrawal_id: "10:1", to_chain: base, deposit_id: "2:1", candidates: 1}

  - name: money_back_into_its_own_chain_pairs_nothing
    description: >-
      The same amount leaves Base and Arbitrum and comes back into each. Each deposit takes the oldest
      waiting withdrawal, which left its own chain, so both are round trips and nothing pairs.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: base, id: "1:1", direction: to_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-09-30 00:00:00+00"}
          - {chain: arbitrum, id: "10:1", direction: to_ethereum, l2_address: "0xa1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-01 00:00:00+00"}
          - {chain: base, id: "2:1", direction: from_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-09 00:00:00+00"}
          - {chain: arbitrum, id: "11:1", direction: from_ethereum, l2_address: "0xa1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-12 00:00:00+00"}
    expect:
      rows: []

  - name: the_oldest_waiting_withdrawal_pays
    description: >-
      A Base withdrawal waits from Oct 2 and an Arbitrum one from Oct 26. The oldest pays for the Base
      deposit of Oct 28, a round trip, and the Arbitrum withdrawal pays for the next Base deposit, on Nov 5.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: base, id: "1:1", direction: to_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-01 00:00:00+00"}
          - {chain: arbitrum, id: "10:1", direction: to_ethereum, l2_address: "0xa1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-20 00:00:00+00"}
          - {chain: base, id: "2:1", direction: from_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-28 00:00:00+00"}
          - {chain: base, id: "3:1", direction: from_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-11-05 00:00:00+00"}
    expect:
      rows:
        - {from_chain: arbitrum, withdrawal_id: "10:1", to_chain: base, deposit_id: "3:1", candidates: 1}

  - name: each_move_pays_once_across_three_chains
    description: >-
      With a third chain, a withdrawal fits deposits on two chains and a deposit fits withdrawals from two.
      Each is used once: the Optimism withdrawal, ready first, pays for the Base deposit, and the Arbitrum
      withdrawal pays for the Optimism deposit.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: optimism, id: "1:1", direction: to_ethereum, l2_address: "0xc1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-09-28 00:00:00+00"}
          - {chain: arbitrum, id: "10:1", direction: to_ethereum, l2_address: "0xa1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-01 00:00:00+00"}
          - {chain: base, id: "20:1", direction: from_ethereum, l2_address: "0xb1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-09 00:00:00+00"}
          - {chain: optimism, id: "2:1", direction: from_ethereum, l2_address: "0xc1", ethereum_address: "0xe1", ethereum_token: "0x01", amount: 100, block_timestamp: "2026-10-10 00:00:00+00"}
    expect:
      rows:
        - {from_chain: optimism, withdrawal_id: "1:1", to_chain: base, deposit_id: "20:1", candidates: 2}
        - {from_chain: arbitrum, withdrawal_id: "10:1", to_chain: optimism, deposit_id: "2:1", candidates: 1}

  - name: only_a_withdrawal_from_another_chain_pays_for_a_deposit
    description: >-
      The pair read on Portal, plus two made-up moves of the same Ethereum address, token and amount: a
      deposit into Arbitrum before the withdrawal, and a withdrawal from Base before the Base deposit. The
      deposit into Arbitrum is no withdrawal, so it pays for nothing, and the Base withdrawal is no deposit,
      so nothing pays for it. The pair stays as it was. The Base withdrawal is ready in time, but it is on
      the deposit's own chain, so candidates leaves it out. It becomes ready after the Arbitrum withdrawal,
      so the deposit takes the older Arbitrum one; an older Base withdrawal would make the deposit a round
      trip, as in money_back_into_its_own_chain_pairs_nothing.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: arbitrum, id: "508746303:6", direction: to_ethereum, l2_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: "716990784284181798845975", block_timestamp: "2026-09-25 11:19:50+00"}
          - {chain: base, id: "52056280:3", direction: from_ethereum, l2_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: "716990784284181798845975", block_timestamp: "2026-10-02 00:45:07+00"}
          # Made up: a deposit into Arbitrum, 5 days before the withdrawal.
          - {chain: arbitrum, id: "1:1", direction: from_ethereum, l2_address: "0xaa", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: "716990784284181798845975", block_timestamp: "2026-09-20 00:00:00+00"}
          # Made up: a withdrawal from Base, ready on 2026-10-01 at 22:00, after the Arbitrum withdrawal
          # (20:55) and before the Base deposit.
          - {chain: base, id: "2:1", direction: to_ethereum, l2_address: "0xbb", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x607f451f850cb612a07b37b6315be23f55165610", amount: "716990784284181798845975", block_timestamp: "2026-09-30 22:00:00+00"}
    expect:
      rows:
        - {from_chain: arbitrum, to_chain: base, withdrawal_id: "508746303:6", deposit_id: "52056280:3", candidates: 1}

  - name: a_deposit_at_the_end_of_the_base_delay_pairs
    description: >-
      Made up: a withdrawal from Base and a deposit into Arbitrum exactly 1 day later, Base's delay. The
      deposit is ready on time, so the two pair and the withdrawal counts as a candidate.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: base, id: "1:1", direction: to_ethereum, l2_address: "0xaa", ethereum_address: "0xcc", ethereum_token: "0x11", amount: 7, block_timestamp: "2026-10-01 00:00:00+00"}
          - {chain: arbitrum, id: "2:1", direction: from_ethereum, l2_address: "0xbb", ethereum_address: "0xcc", ethereum_token: "0x11", amount: 7, block_timestamp: "2026-10-02 00:00:00+00"}
    expect:
      rows:
        - {from_chain: base, to_chain: arbitrum, withdrawal_id: "1:1", deposit_id: "2:1", candidates: 1}

  - name: the_first_withdrawal_pays_for_the_first_deposit_of_its_token
    description: >-
      Made up: two withdrawals from Arbitrum of the same Ethereum address, token and amount, then a deposit
      into Base of that token and a deposit of another token. Both withdrawals are ready before the first
      deposit, so it has two candidates, and the first withdrawal pays for it. The second withdrawal waits
      for a second deposit of its own token, and the deposit of the other token pairs with nothing.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: arbitrum, id: "1:1", direction: to_ethereum, l2_address: "0xaa", ethereum_address: "0xcc", ethereum_token: "0x11", amount: 7, block_timestamp: "2026-10-01 00:00:00+00"}
          - {chain: arbitrum, id: "2:1", direction: to_ethereum, l2_address: "0xaa", ethereum_address: "0xcc", ethereum_token: "0x11", amount: 7, block_timestamp: "2026-10-02 00:00:00+00"}
          - {chain: base, id: "3:1", direction: from_ethereum, l2_address: "0xbb", ethereum_address: "0xcc", ethereum_token: "0x11", amount: 7, block_timestamp: "2026-10-10 00:00:00+00"}
          - {chain: base, id: "4:1", direction: from_ethereum, l2_address: "0xbb", ethereum_address: "0xcc", ethereum_token: "0x22", amount: 7, block_timestamp: "2026-10-11 00:00:00+00"}
    expect:
      rows:
        - {from_chain: arbitrum, to_chain: base, withdrawal_id: "1:1", deposit_id: "3:1", candidates: 2}
