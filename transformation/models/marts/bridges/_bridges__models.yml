version: 2

models:
  - name: bridge_transfers
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || id"
    columns:
      - name: direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [to_ethereum, from_ethereum]
      - name: l2_address
        data_tests: [not_null]
      - name: ethereum_address
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
  - name: bridge_pairs
    columns:
      - name: withdrawal_id
        data_tests: [not_null]
      - name: deposit_id
        data_tests: [not_null]

unit_tests:
  - name: a_late_deposit_of_the_same_amount_pairs
    description: >-
      The proof pair of catalog/protocols/arbitrum-token-bridge/NOTES.md: 74779634313900000000000 SQD left
      Arbitrum on 2026-10-02 and reached Base on 2026-10-09 through 0x8100. A deposit of another amount, one
      too soon after its withdrawal, and one on the same chain do not pair.
    model: bridge_pairs
    given:
      - input: ref('bridge_transfers')
        rows:
          - {chain: arbitrum, id: "511073531:10", direction: to_ethereum, l2_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x1337", amount: "74779634313900000000000", block_timestamp: "2026-10-02 18:55:09+00"}
          - {chain: base, id: "52377952:2", direction: from_ethereum, l2_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x1337", amount: "74779634313900000000000", block_timestamp: "2026-10-09 11:27:31+00"}
          - {chain: base, id: "2:1", direction: from_ethereum, l2_address: "0xaa", ethereum_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", ethereum_token: "0x1337", amount: 5, block_timestamp: "2026-10-20 00:00:00+00"}
          - {chain: arbitrum, id: "3:1", direction: to_ethereum, l2_address: "0xbb", ethereum_address: "0xcc", ethereum_token: "0x1337", amount: 7, block_timestamp: "2026-10-10 00:00:00+00"}
          - {chain: base, id: "4:1", direction: from_ethereum, l2_address: "0xdd", ethereum_address: "0xcc", ethereum_token: "0x1337", amount: 7, block_timestamp: "2026-10-12 00:00:00+00"}
          - {chain: arbitrum, id: "5:1", direction: to_ethereum, l2_address: "0xee", ethereum_address: "0xff", ethereum_token: "0x1337", amount: 9, block_timestamp: "2026-10-01 00:00:00+00"}
          - {chain: arbitrum, id: "6:1", direction: from_ethereum, l2_address: "0xee", ethereum_address: "0xff", ethereum_token: "0x1337", amount: 9, block_timestamp: "2026-10-20 00:00:00+00"}
    expect:
      rows:
        - {from_chain: arbitrum, from_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", to_chain: base, to_address: "0x81004f46e7fda526bd49529b544011dad06cfab9", withdrawal_id: "511073531:10", deposit_id: "52377952:2", candidates: 1}
