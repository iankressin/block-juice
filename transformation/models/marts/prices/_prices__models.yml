version: 2

models:
  - name: token_prices
    description: One candle of one token against one quote asset at one interval, from Binance. Prices are in quote-asset units, volume in token units and quote_volume in quote-asset units.
    columns:
      - name: token
        description: The token's Binance ticker, such as UNI.
        data_tests: [not_null]
      - name: quote
        description: The asset the prices are in, such as USDT.
        data_tests: [not_null]
      - name: interval
        description: The candle's length, as Binance names it, such as 1h or 1d.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w]
      - name: open_time
        description: When the candle opened.
        data_tests: [not_null]
      - name: close_time
        description: The candle's last millisecond.
        data_tests: [not_null]
      - name: open
        description: The first trade's price, in quote-asset units.
        data_tests: [not_null]
      - name: high
        description: The highest trade price, in quote-asset units.
        data_tests: [not_null]
      - name: low
        description: The lowest trade price, in quote-asset units.
        data_tests: [not_null]
      - name: close
        description: The last trade's price, in quote-asset units.
        data_tests: [not_null]
      - name: volume
        description: How much of the token traded, in token units.
        data_tests: [not_null]
      - name: quote_volume
        description: How much of the quote asset traded, in quote-asset units.
        data_tests: [not_null]
      - name: trades
        description: How many trades the candle holds.
        data_tests: [not_null]
