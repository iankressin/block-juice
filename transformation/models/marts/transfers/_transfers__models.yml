version: 2

models:
  - name: erc20_transfers
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || id"
    columns:
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum, arbitrum, base]
      - name: id
        data_tests: [not_null]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests: [not_null]
      - name: token
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
