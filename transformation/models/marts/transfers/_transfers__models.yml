version: 2

models:
  - name: labelled_wallet_flows
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || id || ':' || entity"
    columns:
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum, arbitrum, base]
      - name: id
        data_tests: [not_null]
      - name: block_number
        data_tests: [not_null]
      - name: asset
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
      - name: entity
        data_tests: [not_null]
      - name: wallet
        data_tests: [not_null]
      - name: direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [inflow, outflow, intra]
  - name: erc20_transfers
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || id"
    columns:
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum, arbitrum, base]
      - name: id
        data_tests: [not_null]
      - name: block_number
        data_tests: [not_null]
      - name: tx_hash
        data_tests: [not_null]
      - name: token
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
  - name: classified_transfers
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || id"
    columns:
      - name: from_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [exchange, deposit, contract, eoa, bridge, unknown]
      - name: to_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [exchange, deposit, contract, eoa, bridge, unknown]
      - name: from_entity
        data_tests: [not_null]
      - name: to_entity
        data_tests: [not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bridge, exchange, contract, p2p, unknown]

unit_tests:
  - name: a_deposit_address_sends_only_to_one_exchange
    description: >-
      0xd1 sends its one Arbitrum transfer to Binance, so it is a Binance deposit address and 0xa1 paying it
      pays Binance. 0xd2 sends one token to Binance and another to an EOA, 0xd3 sends to two exchanges, and
      Binance's own 0xe1 sends only to Coinbase: none of them is a deposit address. 0xd1's Base transfer
      does not count against it on Arbitrum. A mint is a bridge transfer even into an exchange, and a
      transfer to self is left out.
    model: classified_transfers
    given:
      - input: ref('erc20_transfers')
        rows:
          - {chain: arbitrum, id: "1:1", token: "0xt1", from_address: "0xa1", to_address: "0xd1", value: 1}
          - {chain: arbitrum, id: "1:2", token: "0xt1", from_address: "0xd1", to_address: "0xe1", value: 1}
          - {chain: arbitrum, id: "1:3", token: "0xt1", from_address: "0xd2", to_address: "0xe1", value: 1}
          - {chain: arbitrum, id: "1:4", token: "0xt2", from_address: "0xd2", to_address: "0xa2", value: 1}
          - {chain: arbitrum, id: "1:5", token: "0xt1", from_address: "0xd3", to_address: "0xe1", value: 1}
          - {chain: arbitrum, id: "1:6", token: "0xt1", from_address: "0xd3", to_address: "0xe2", value: 1}
          - {chain: arbitrum, id: "1:7", token: "0xt1", from_address: "0x0000000000000000000000000000000000000000", to_address: "0xe2", value: 1}
          - {chain: arbitrum, id: "1:8", token: "0xt1", from_address: "0xe1", to_address: "0xe2", value: 1}
          - {chain: arbitrum, id: "1:9", token: "0xt1", from_address: "0xa1", to_address: "0xc1", value: 1}
          - {chain: arbitrum, id: "1:10", token: "0xt1", from_address: "0xa1", to_address: "0xa2", value: 1}
          - {chain: arbitrum, id: "1:11", token: "0xt1", from_address: "0xa1", to_address: "0xa1", value: 1}
          - {chain: base, id: "2:1", token: "0xt1", from_address: "0xd1", to_address: "0xa1", value: 1}
      - input: ref('address_labels')
        rows:
          - {chain: arbitrum, address: "0xe1", kind: exchange, exchange: Binance}
          - {chain: arbitrum, address: "0xe2", kind: exchange, exchange: Coinbase}
          - {chain: arbitrum, address: "0xc1", kind: contract, exchange: null}
          - {chain: arbitrum, address: "0xa1", kind: eoa, exchange: null}
          - {chain: arbitrum, address: "0xa2", kind: eoa, exchange: null}
    expect:
      rows:
        - {chain: arbitrum, id: "1:1", from_kind: eoa, from_entity: "0xa1", from_group: eoa, to_kind: deposit, to_entity: Binance, to_group: exchange, category: exchange}
        - {chain: arbitrum, id: "1:2", from_kind: deposit, from_entity: Binance, from_group: exchange, to_kind: exchange, to_entity: Binance, to_group: exchange, category: exchange}
        - {chain: arbitrum, id: "1:3", from_kind: unknown, from_entity: "0xd2", from_group: unknown, to_kind: exchange, to_entity: Binance, to_group: exchange, category: exchange}
        - {chain: arbitrum, id: "1:4", from_kind: unknown, from_entity: "0xd2", from_group: unknown, to_kind: eoa, to_entity: "0xa2", to_group: eoa, category: unknown}
        - {chain: arbitrum, id: "1:5", from_kind: unknown, from_entity: "0xd3", from_group: unknown, to_kind: exchange, to_entity: Binance, to_group: exchange, category: exchange}
        - {chain: arbitrum, id: "1:6", from_kind: unknown, from_entity: "0xd3", from_group: unknown, to_kind: exchange, to_entity: Coinbase, to_group: exchange, category: exchange}
        - {chain: arbitrum, id: "1:7", from_kind: bridge, from_entity: "bridge:arbitrum", from_group: bridge, to_kind: exchange, to_entity: Coinbase, to_group: exchange, category: bridge}
        - {chain: arbitrum, id: "1:8", from_kind: exchange, from_entity: Binance, from_group: exchange, to_kind: exchange, to_entity: Coinbase, to_group: exchange, category: exchange}
        - {chain: arbitrum, id: "1:9", from_kind: eoa, from_entity: "0xa1", from_group: eoa, to_kind: contract, to_entity: "0xc1", to_group: contract, category: contract}
        - {chain: arbitrum, id: "1:10", from_kind: eoa, from_entity: "0xa1", from_group: eoa, to_kind: eoa, to_entity: "0xa2", to_group: eoa, category: p2p}
        - {chain: base, id: "2:1", from_kind: unknown, from_entity: "0xd1", from_group: unknown, to_kind: unknown, to_entity: "0xa1", to_group: unknown, category: unknown}
  - name: a_labelled_flow_takes_its_direction_and_counterparty
    description: >-
      0xm1 and 0xm2 are MEXC's, 0xb1 Binance's (labels as published, in mixed case). A Binance-to-MEXC
      transfer is a MEXC inflow from Binance and a Binance outflow to MEXC. MEXC to an unlabelled address is
      an outflow with no counterparty entity, and MEXC to MEXC one intra row. A native transaction counts
      only when it succeeded with value: the reverted one and the zero-value one are left out. A transfer
      that touches no label is left out.
    model: labelled_wallet_flows
    given:
      - input: ref('wallet_labels')
        rows:
          - {chain: ethereum, address: "0xM1", entity: MEXC, list: test}
          - {chain: ethereum, address: "0xm2", entity: MEXC, list: test}
          - {chain: ethereum, address: "0xB1", entity: Binance, list: test}
      - input: ref('wallet_transactions')
        rows:
          - {chain: ethereum, block_number: 1, tx_hash: "0xt1", from_address: "0xb1", to_address: "0xm1", value_wei: 5, succeeded: true}
          - {chain: ethereum, block_number: 1, tx_hash: "0xt2", from_address: "0xm1", to_address: "0xa1", value_wei: 5, succeeded: false}
          - {chain: ethereum, block_number: 1, tx_hash: "0xt3", from_address: "0xm1", to_address: "0xa1", value_wei: 0, succeeded: true}
          - {chain: ethereum, block_number: 1, tx_hash: "0xt4", from_address: "0xm1", to_address: "0xm2", value_wei: 7, succeeded: true}
      - input: ref('erc20_transfers')
        rows:
          - {chain: ethereum, id: "2:1", block_number: 2, token: "0xusdt", from_address: "0xm2", to_address: "0xa1", value: 3}
          - {chain: ethereum, id: "2:2", block_number: 2, token: "0xusdt", from_address: "0xa1", to_address: "0xa2", value: 4}
          - {chain: ethereum, id: "2:3", block_number: 2, token: "0xusdt", from_address: "0xm2", to_address: "0xb1", value: 6}
    expect:
      rows:
        - {id: "tx:0xt1", asset: native, value: 5, entity: MEXC, direction: inflow, wallet: "0xm1", counterparty_address: "0xb1", counterparty_entity: Binance}
        - {id: "tx:0xt1", asset: native, value: 5, entity: Binance, direction: outflow, wallet: "0xb1", counterparty_address: "0xm1", counterparty_entity: MEXC}
        - {id: "tx:0xt4", asset: native, value: 7, entity: MEXC, direction: intra, wallet: "0xm1", counterparty_address: "0xm2", counterparty_entity: null}
        - {id: "2:1", asset: "0xusdt", value: 3, entity: MEXC, direction: outflow, wallet: "0xm2", counterparty_address: "0xa1", counterparty_entity: null}
        - {id: "2:3", asset: "0xusdt", value: 6, entity: MEXC, direction: outflow, wallet: "0xm2", counterparty_address: "0xb1", counterparty_entity: Binance}
        - {id: "2:3", asset: "0xusdt", value: 6, entity: Binance, direction: inflow, wallet: "0xb1", counterparty_address: "0xm2", counterparty_entity: MEXC}
