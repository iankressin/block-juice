version: 2

models:
  - name: lighter_markets
    description: >-
      One row per Lighter market, perp or spot, from the latest run that read it.
    columns:
      - name: market_id
        description: The public market id the API uses. A symbol is not unique, so join on this.
        data_tests: [unique, not_null]
      - name: symbol
        data_tests: [not_null]
      - name: market_type
        data_tests:
          - accepted_values:
              arguments:
                values: [perp, spot]
      - name: size_decimals
        data_tests: [not_null]
      - name: price_decimals
        data_tests: [not_null]
      - name: maker_fee_pct
        description: The maker fee in percent, as Lighter sends it.
      - name: taker_fee_pct
        description: The taker fee in percent, as Lighter sends it.
      - name: read_at
        description: When the run read these settings.

  - name: lighter_candles
    description: >-
      One Lighter candle per market, price series and bucket. Only closed candles load.
    columns:
      - name: id
        description: The candle's key, `<market_id>:<price>:<resolution>:<open_time in ms>`.
        data_tests: [unique, not_null]
      - name: market_id
        description: The public market id the API uses. Join on this, not on `symbol`.
        data_tests: [not_null]
      - name: symbol
        data_tests: [not_null]
      - name: price
        description: The series, `trade` for traded prices or `mark` for mark prices.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [trade, mark]
      - name: resolution
        data_tests: [not_null]
      - name: open_time
        description: The start of the bucket.
        data_tests: [not_null]
      - name: open
        data_tests: [not_null]
      - name: high
        data_tests: [not_null]
      - name: low
        data_tests: [not_null]
      - name: close
        data_tests: [not_null]
      - name: base_volume
        description: Volume in base units. Null on a mark candle.
      - name: quote_volume
        description: Volume in USDC. Null on a mark candle.
      - name: last_trade_id
        description: The last trade id in the bucket. Null on a mark candle.
      - name: samples
        description: How many mark-price samples the bucket holds. Null on a trade candle.

  - name: lighter_funding_rates
    description: >-
      One hourly funding rate per Lighter perp market. `funding_time` is the hour mark the rate is paid
      at, and an entry loads once its hour mark has passed. `signed_rate_pct` is positive when longs pay shorts. Lighter
      sends the rate unsigned with a `direction`, and that `long` names the paying side is inferred
      from the funding page's rule, not stated by Lighter for `direction`; see
      `catalog/vendors/lighter/NOTES.md`.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: market_id
        description: The public market id the API uses. Join on this, not on `symbol`.
        data_tests: [not_null]
      - name: symbol
        data_tests: [not_null]
      - name: funding_time
        description: The hour mark the rate is paid at.
        data_tests: [not_null]
      - name: rate_pct
        description: The rate in percent per hour, unsigned, as Lighter sends it. A rate can be 0.
        data_tests: [not_null]
      - name: signed_rate_pct
        description: >-
          `rate_pct` for `long` and `-rate_pct` for `short`. Positive means longs pay shorts. That the
          paying side is the `direction` side is inferred from the funding page's rule; see
          `catalog/vendors/lighter/NOTES.md`.
      - name: value_usdc_per_unit
        description: USDC paid per one unit of base for the hour.
      - name: direction
        description: "`long` for a positive rate and `short` for a negative one."
        data_tests:
          - accepted_values:
              arguments:
                values: [long, short]

  - name: lighter_exchange_metrics
    description: >-
      One daily Lighter exchange metric. `day` is the UTC day, and only ended days load. `market` is
      the symbol for a per-market series and null for an exchange-wide one. `value` is in the kind's
      unit. USDC: `volume`, `maker_fee`, `taker_fee`, `liquidation_fee`, `liquidation_volume`,
      `attribution_maker_fee`, `attribution_taker_fee`, `inflow`, `outflow`, `transfer_fee`,
      `withdraw_fee`, `buyback_usdc` and `open_interest`. LIT: `buyback`. A count: `trade_count`,
      `liquidation_count`, `account_count` and `active_account_count`. Only `volume`, the three fee
      kinds, `trade_count`, `liquidation_count` and ETH's `liquidation_volume` are proven against
      Lighter's trade files; the other units are as the kind's name says, not proven; see
      `catalog/vendors/lighter/NOTES.md`. Eight kinds are exchange-wide whatever the market, so
      their `market` is null.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: day
        description: The UTC day the point covers.
        data_tests: [not_null]
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - volume
                  - maker_fee
                  - taker_fee
                  - liquidation_fee
                  - trade_count
                  - liquidation_count
                  - liquidation_volume
                  - open_interest
                  - attribution_maker_fee
                  - attribution_taker_fee
                  - account_count
                  - active_account_count
                  - inflow
                  - outflow
                  - transfer_fee
                  - withdraw_fee
                  - buyback
                  - buyback_usdc
      - name: market
        description: The symbol for a per-market series. Null for an exchange-wide one.
      - name: value
        description: The day's value in the kind's unit, as Lighter sends it.
        data_tests: [not_null]

  - name: lighter_open_interest
    description: >-
      One end-of-hour open interest reading per Lighter market, from Lighter's hourly S3 files.
      `hour` is the start of the hour the reading closes. The file names the market by symbol only,
      and two markets can share a symbol, so there is no `market_id`. A day's file appears about
      07:03 UTC the next day, so only ended days load.
    columns:
      - name: id
        description: "`<symbol>:<hour>`."
        data_tests: [unique]
      - name: hour
        description: The start of the hour the reading closes, in UTC.
        data_tests: [not_null]
      - name: symbol
        data_tests: [not_null]
      - name: open_interest
        description: Open interest in base units.
        data_tests: [not_null]
      - name: mark_price
        description: The mark price at the end of the hour, in USDC.
      - name: open_interest_usd
        description: "`open_interest` times `mark_price`, in USDC."

  - name: lighter_trades
    description: >-
      One Lighter trade of the accounts and markets that the lighter-trades source's `addresses.json`
      lists, from Lighter's daily S3 files. A day's file appears about 07:03 UTC the next day, so only
      ended days load. Values are in real units, from `catalog/vendors/lighter/NOTES.md`. A binary
      option has no row in `lighter_markets`, so its `symbol`, `price`, `size` and positions are null.
      Every trade of a market is scaled by that market's latest decimals. The test
      `lighter_markets_keep_their_decimals` fails the build if a market's decimals ever change, since
      older trades would then mis-scale: they would need scaling by the reading in effect at trade time.
    columns:
      - name: trade_id
        description: Lighter's trade id, unique in the two day files checked (catalog/vendors/lighter/NOTES.md, P8). Raw trades are keyed on it, so a repeated id would merge two trades.
        data_tests: [unique, not_null]
      - name: trade_time
        description: The block time of the trade.
        data_tests: [not_null]
      - name: block_number
        description: The L2 block that holds the trade, the API's `block_height`.
      - name: trade_type
        data_tests:
          - accepted_values:
              arguments:
                values: [trade, liquidation, deleverage, market-settlement]
      - name: market_id
        description: >-
          The public market id the API uses: the file's `public_market_index`, or its slot before
          2026-08-20, when the file has no public id. Join on this, never on `slot_market_id`.
        data_tests: [not_null]
      - name: slot_market_id
        description: The file's `market_id`, a slot that Lighter reuses for later markets.
      - name: price
        description: USDC per base unit.
      - name: size
        description: Base units.
      - name: price_raw
        description: The price as the file holds it, times 10^`price_decimals`.
        data_tests: [not_null]
      - name: size_raw
        description: The size as the file holds it, times 10^`size_decimals`.
        data_tests: [not_null]
      - name: notional_usdc
        description: "The trade value in USDC, `usdc_amount / 10^6`. Set for a binary option, whose `size` and `price` are null."
      - name: maker_account_index
        description: The ask account when `is_maker_ask`, else the bid account.
      - name: taker_account_index
        description: The other account. 281474976710655 (2^48 − 1) means no account.
      - name: taker_side
        description: "`buy` when the taker is the bid account, `sell` when it is the ask."
      - name: maker_fee_ppm
        description: The maker fee in parts per million of notional.
      - name: taker_fee_ppm
        description: The taker fee in parts per million of notional.
      - name: ask_order_index
        description: The ask order's index.
      - name: bid_order_index
        description: The bid order's index.
      - name: maker_position_before
        description: The maker's position in base units before the trade, negative when short.
      - name: taker_position_before
        description: The taker's position in base units before the trade, negative when short.
      - name: maker_entry_quote_before_usdc
        description: The entry value of the maker's position before the trade, in USDC.
      - name: taker_entry_quote_before_usdc
        description: The entry value of the taker's position before the trade, in USDC.
      - name: ask_account_pnl
        description: The ask account's realized pnl from the trade, in USDC. Null when none.
      - name: bid_account_pnl
        description: The bid account's realized pnl from the trade, in USDC. Null when none.

  - name: lighter_account_fills
    description: >-
      One fill per account and trade: each trade gives its maker one row and its taker one row, with the
      account's position before and after. A side with no account (281474976710655, on
      market-settlement trades) has no row. A binary option has no market row, so its `symbol`, `signed_size`
      and positions are null.
    columns:
      - name: id
        description: "`<trade_id>:<role>`."
        data_tests: [unique, not_null]
      - name: trade_id
        description: Lighter's trade id.
        data_tests: [not_null]
      - name: trade_time
        description: The block time of the trade.
        data_tests: [not_null]
      - name: market_id
        description: The public market id the API uses. Join on this.
        data_tests: [not_null]
      - name: symbol
        description: The market's name. Null for a binary option.
      - name: account_index
        description: The account that made this side of the trade.
        data_tests: [not_null]
      - name: role
        description: "`maker` for the resting order's account, `taker` for the account that crossed it."
        data_tests:
          - accepted_values:
              arguments:
                values: [maker, taker]
      - name: side
        description: "`sell` for the ask account, `buy` for the bid account."
        data_tests:
          - accepted_values:
              arguments:
                values: [buy, sell]
      - name: signed_size
        description: Base units, positive for a buy and negative for a sell.
        data_tests:
          - not_null:
              config:
                where: "symbol is not null"
      - name: price
        description: USDC per base unit.
      - name: notional_usdc
        description: The trade's value in USDC.
      - name: fee_ppm
        description: The fee of this row's role, in parts per million of notional.
      - name: fee_usdc
        description: The fee of this row's role, in USDC.
      - name: position_before
        description: The account's position in base units before the trade, negative when short.
      - name: position_after
        description: "`position_before` plus `signed_size`."
        data_tests:
          - not_null:
              config:
                where: "symbol is not null"
      - name: entry_quote_before_usdc
        description: The entry value of the account's position before the trade, in USDC.
      - name: position_sign_changed
        description: True when the trade changed the sign of the account's position.
      - name: realized_pnl
        description: The pnl the trade realized for this account, in USDC. Null when none.

  - name: lighter_batches
    description: >-
      One Lighter L1 batch: the block range it holds, its tx count, its status, and the hash and time of
      its commit, verify and execute on Ethereum. Join an L2 block to its batch on `block_number between
      first_block and last_block`; the test `lighter_batches_are_contiguous` fails when a range has a gap
      or two loaded neighbours do not meet. A batch is final once a status change is `executed` or
      `nothing_to_execute`; until then each run reads it again. Batches before 29654 carry no L1 status,
      so they stay `pending`; see `catalog/vendors/lighter/NOTES.md`.
    columns:
      - name: batch_number
        data_tests: [unique, not_null]
      - name: first_block
        description: The lowest L2 block the batch holds.
      - name: last_block
        description: The highest L2 block the batch holds.
      - name: block_count
        description: How many blocks the batch lists. Equals `last_block - first_block + 1`.
      - name: tx_count
        description: The sum of the blocks' `total_transactions`.
      - name: first_block_time
        description: The first block's time, to the microsecond.
      - name: last_block_time
        description: The last block's time, to the microsecond.
      - name: status
        description: >-
          The latest status change's, or `pending` with none. `committed` → `verified` → `executed`, or
          `committed` → `nothing_to_execute` for a verified batch with no L1 work left.
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, committed, verified, executed, nothing_to_execute]
      - name: is_final
        description: True once a status change is `executed` or `nothing_to_execute`. A final batch changes no more.
      - name: commit_tx_hash
        description: The Ethereum tx that committed the batch. Null until then, and on batches 29654 to 29668.
      - name: committed_at
        description: When the status change carrying `commit_tx_hash` happened.
      - name: verify_tx_hash
        description: The Ethereum tx that verified the batch. A `nothing_to_execute` change carries it too.
      - name: verified_at
        description: When the status change carrying `verify_tx_hash` happened.
      - name: execute_tx_hash
        description: The Ethereum tx that executed the batch. Null on a `nothing_to_execute` batch. One tx can execute several batches.
      - name: executed_at
        description: When the status change carrying `execute_tx_hash` happened.
      - name: final_at
        description: When the first `executed` or `nothing_to_execute` change happened.
      - name: updated_at
        description: When the Explorer last updated the batch.

  - name: lighter_account_movements
    description: >-
      One leg of a deposit, withdrawal, transfer, route move, pool, staking or margin move in the log of an
      account the lighter-account-logs source lists, with the L1 batch whose block range holds the entry's
      block and that batch's Ethereum hashes and times. An entry gives a leg for each account it moves,
      and a row only for the legs of the account whose log holds it. A move has settled on Ethereum once
      its batch is `executed` or `nothing_to_execute`; deposits and transfers sit in either. A transfer
      to the fast-withdraw pool, likely account 675395, is the user's side of a fast withdrawal. The test
      `lighter_movements_match_detail_batch` warns when the batch differs from the one the Explorer names,
      or when a loaded batch should hold a row's block and none does; see `catalog/vendors/lighter/NOTES.md`.
    columns:
      - name: id
        description: "`<hash>:<account_index>:<leg>`."
        data_tests: [unique, not_null]
      - name: hash
        description: The entry's hash, the same in each account's log that holds it.
        data_tests: [not_null]
      - name: log_time
        description: The entry's time, to the microsecond. Never join it to a batch by time.
        data_tests: [not_null]
      - name: account_index
        description: The account whose log holds the entry, and whose leg this row is.
        data_tests: [not_null]
      - name: leg
        description: "`from`, `to` or `fee` for a transfer or route move, `self` for the rest."
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - deposit
                  - withdrawal
                  - transfer_out
                  - transfer_in
                  - transfer_fee
                  - route_move
                  - pool_mint
                  - pool_burn
                  - stake
                  - unstake
                  - unlock
                  - margin_move
      - name: asset
        description: The asset's symbol, such as `USDC` or `LIT`.
      - name: route
        description: "`perps` or `spot`. Null for stake, unstake, unlock and margin moves."
        data_tests:
          - accepted_values:
              arguments:
                values: [perps, spot]
      - name: amount
        description: The amount as Lighter sent it, in the asset's units with its decimals. Unsigned.
        data_tests: [not_null]
      - name: signed_amount
        description: >-
          `amount`, negative when it leaves the account or route. Null for stake, unstake, unlock and
          margin moves, whose sign is unproven.
      - name: counterparty_account_index
        description: >-
          The other account of a transfer, the fee account of a transfer fee, or the pool of a mint, burn,
          stake or unstake. Null for a deposit, a withdrawal and a route move.
      - name: l1_address
        description: The Ethereum address a deposit came from, lowercased. Null on other kinds.
      - name: pubdata_type
        description: The entry's type, such as `L1DepositV2` or `L2TransferV2`.
      - name: tx_type
        description: The tx's type, such as `L1Withdraw` or `L2Transfer`.
      - name: block_number
        description: The L2 block that holds the entry, from `logs/{hash}`. Null until that lookup succeeds.
      - name: batch_number
        description: The loaded batch whose block range holds `block_number`. Null until that batch loads.
      - name: detail_batch_number
        description: The batch `logs/{hash}` named, null when read before the batch formed. Use `batch_number`.
      - name: batch_status
        description: The batch's status, as in `lighter_batches`.
      - name: is_final
        description: True once the batch is `executed` or `nothing_to_execute`. False with no batch.
      - name: commit_tx_hash
        description: The Ethereum tx that committed the batch.
      - name: committed_at
        description: When the batch was committed.
      - name: verify_tx_hash
        description: The Ethereum tx that verified the batch.
      - name: verified_at
        description: When the batch was verified.
      - name: execute_tx_hash
        description: The Ethereum tx that executed the batch. Null on a `nothing_to_execute` batch.
      - name: executed_at
        description: When the batch was executed.
      - name: final_at
        description: When the batch became final.

  - name: lighter_account_snapshots
    description: >-
      One row per Lighter account per run that read it, from the account endpoint. `collateral` leaves
      out unrealized pnl; `total_asset_value` includes it.
    columns:
      - name: id
        description: "`<account_index>:<read_at in ms>`."
        data_tests: [unique, not_null]
      - name: account_index
        data_tests: [not_null]
      - name: read_at
        description: When the run read the account.
        data_tests: [not_null]
      - name: collateral
        data_tests: [not_null]
      - name: transaction_time
        description: Lighter's time for the reading, to the microsecond.

  - name: lighter_account_position_snapshots
    description: >-
      One row per position of an account in a reading. A closed position stays listed with `position` 0.
    columns:
      - name: id
        description: "`<account_index>:<market_id>:<read_at in ms>`."
        data_tests: [unique, not_null]
      - name: read_at
        data_tests: [not_null]
      - name: position
        description: Signed size in base units, negative when short.
      - name: total_funding_paid_out
        description: Lighter leaves it out on some positions, so it can be null.

  - name: lighter_account_asset_snapshots
    description: One row per asset balance of an account in a reading, in the asset's own units.
    columns:
      - name: id
        description: "`<account_index>:<asset_id>:<read_at in ms>`."
        data_tests: [unique, not_null]
      - name: read_at
        data_tests: [not_null]

  - name: lighter_account_value_history
    description: >-
      One row per account, resolution and point time, from the pnl endpoint. Every column but `volume` is a
      running total since the account began, up to `point_time`. Lighter sends the values as JSON numbers,
      so they keep up to 15 significant digits. `perps_value` is the account's perps value then.
    columns:
      - name: id
        description: "`<account_index>:<resolution>:<point time in s>`."
        data_tests: [unique, not_null]
      - name: account_index
        data_tests: [not_null]
      - name: resolution
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1d', '1h']
      - name: point_time
        data_tests: [not_null]
      - name: perps_value
        description: "`inflow - outflow + trade_pnl`: the account's `collateral` plus unrealized pnl."

  - name: lighter_tx_stats
    description: >-
      Lighter's tx count for each closed UTC hour since 2025-10-02, from the Explorer's `stats/tx`. `hour`
      is the start of the hour. The hour still open waits for a later run, so the newest row is the last
      hour that ended before the latest run.
    columns:
      - name: hour
        data_tests: [unique, not_null]
      - name: tx_count
        description: Txs in the hour.
        data_tests: [not_null]
      - name: uops_count
        description: User operations in the hour.
        data_tests: [not_null]

unit_tests:
  # Account 1000, idle since 2025-12-30 (catalog/vendors/lighter/NOTES.md, Account value, L14): its point reads
  # 156508.908444 - 153478.114476 - 3030.185271 = 0.608697, its collateral and total_asset_value.
  - name: perps_value_is_inflow_less_outflow_plus_trade_pnl
    description: >-
      Account 1000's point has inflow 156508.908444, outflow 153478.114476 and trade_pnl -3030.185271, so
      its perps value is 0.608697.
    model: lighter_account_value_history
    given:
      - input: ref('stg_lighter__pnl')
        rows:
          - {id: "1000:1d:1794268800", account_index: 1000, resolution: 1d, point_time: "2026-11-10 00:00:00+00", inflow: 156508.908444, outflow: 153478.114476, trade_pnl: -3030.185271}
    expect:
      rows:
        - {id: "1000:1d:1794268800", account_index: 1000, resolution: 1d, point_time: "2026-11-10 00:00:00+00", inflow: 156508.908444, outflow: 153478.114476, trade_pnl: -3030.185271, perps_value: 0.608697}
