version: 2

models:
  - name: lighter_markets
    description: >-
      One row per Lighter market, perp or spot, from the latest run that read it.
    columns:
      - name: market_id
        description: The public market id the API uses. A symbol is not unique, so join on this.
        data_tests: [unique, not_null]
      - name: symbol
        data_tests: [not_null]
      - name: market_type
        data_tests:
          - accepted_values:
              arguments:
                values: [perp, spot]
      - name: size_decimals
        data_tests: [not_null]
      - name: price_decimals
        data_tests: [not_null]
      - name: maker_fee_pct
        description: The maker fee in percent, as Lighter sends it.
      - name: taker_fee_pct
        description: The taker fee in percent, as Lighter sends it.
      - name: read_at
        description: When the run read these settings.

  - name: lighter_candles
    description: >-
      One Lighter candle per market, price series and bucket. Only closed candles load.
    columns:
      - name: market_id
        description: The public market id the API uses. Join on this, not on `symbol`.
        data_tests: [not_null]
      - name: symbol
        data_tests: [not_null]
      - name: price
        description: The series, `trade` for traded prices or `mark` for mark prices.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [trade, mark]
      - name: resolution
        data_tests: [not_null]
      - name: open_time
        description: The start of the bucket.
        data_tests: [not_null]
      - name: open
        data_tests: [not_null]
      - name: high
        data_tests: [not_null]
      - name: low
        data_tests: [not_null]
      - name: close
        data_tests: [not_null]
      - name: base_volume
        description: Volume in base units. Null on a mark candle.
      - name: quote_volume
        description: Volume in USDC. Null on a mark candle.
      - name: last_trade_id
        description: The last trade id in the bucket. Null on a mark candle.
      - name: samples
        description: How many mark-price samples the bucket holds. Null on a trade candle.

  - name: lighter_funding_rates
    description: >-
      One hourly funding rate per Lighter perp market. `funding_time` is the hour mark the rate is paid
      at, and only closed hours load. `signed_rate_pct` is positive when longs pay shorts. Lighter
      sends the rate unsigned with a `direction`, and that `long` names the paying side is inferred
      from the funding page's rule, not stated by Lighter for `direction`; see
      `catalog/vendors/lighter/NOTES.md`.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: market_id
        description: The public market id the API uses. Join on this, not on `symbol`.
        data_tests: [not_null]
      - name: symbol
        data_tests: [not_null]
      - name: funding_time
        description: The hour mark the rate is paid at.
        data_tests: [not_null]
      - name: rate_pct
        description: The rate in percent per hour, unsigned, as Lighter sends it. A closed hour can be 0.
        data_tests: [not_null]
      - name: signed_rate_pct
        description: >-
          `rate_pct` for `long` and `-rate_pct` for `short`. Positive means longs pay shorts. That the
          paying side is the `direction` side is inferred from the funding page's rule; see
          `catalog/vendors/lighter/NOTES.md`.
      - name: value_usdc_per_unit
        description: USDC paid per one unit of base for the hour.
      - name: direction
        description: "`long` for a positive rate and `short` for a negative one."
        data_tests:
          - accepted_values:
              arguments:
                values: [long, short]

  - name: lighter_exchange_metrics
    description: >-
      One daily Lighter exchange metric. `day` is the UTC day, and only ended days load. `market` is
      the symbol for a per-market series and null for an exchange-wide one. `value` is in the kind's
      unit. USDC: `volume`, `maker_fee`, `taker_fee`, `liquidation_fee`, `liquidation_volume`,
      `attribution_maker_fee`, `attribution_taker_fee`, `inflow`, `outflow`, `transfer_fee`,
      `withdraw_fee`, `buyback_usdc` and `open_interest`. LIT: `buyback`. A count: `trade_count`,
      `liquidation_count`, `account_count` and `active_account_count`. Only `volume`, the three fee
      kinds, `trade_count`, `liquidation_count` and ETH's `liquidation_volume` are proven against
      Lighter's trade files; the other units are as the kind's name says, not proven; see
      `catalog/vendors/lighter/NOTES.md`. Eight kinds are exchange-wide whatever the market, so
      their `market` is null.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: day
        description: The UTC day the point covers.
        data_tests: [not_null]
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - volume
                  - maker_fee
                  - taker_fee
                  - liquidation_fee
                  - trade_count
                  - liquidation_count
                  - liquidation_volume
                  - open_interest
                  - attribution_maker_fee
                  - attribution_taker_fee
                  - account_count
                  - active_account_count
                  - inflow
                  - outflow
                  - transfer_fee
                  - withdraw_fee
                  - buyback
                  - buyback_usdc
      - name: market
        description: The symbol for a per-market series. Null for an exchange-wide one.
      - name: value
        description: The day's value in the kind's unit, as Lighter sends it.
        data_tests: [not_null]
