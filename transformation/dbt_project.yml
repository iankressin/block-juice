name: transformation
version: "1.0.0"
profile: transformation

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

# The token the token_* analyses follow. To follow another, load its transfers, bridge moves and address
# code, then pass it with --vars '{token: {...}}'.
vars:
  token:
    ethereum: "0x1f9840a85d5af5bf1d1762f925bdaddc4201f984"
    decimals: 18
    windows:
      - {chain: arbitrum, token: "0xfa7f8980b0f1e64a2062791cc3b0871572f1f7f0", blocks: [510496864, 520129273]}
      - {chain: base, token: "0xc3de830ea07524a0761646a6a4e4be0e114a3c83", blocks: [52011727, 53350926]}

models:
  transformation:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
      # Views, not ephemeral, so each chain's rows show up as their own step in Dagster.
      balances:
        +materialized: view
      # Views, so each protocol version's rows show up as their own step in Dagster.
      dex:
        +materialized: view
      # Views, so each chain's transfers show up as their own step in Dagster.
      transfers:
        +materialized: view
      # Views, so each chain's code readings show up as their own step in Dagster.
      labels:
        +materialized: view
      # Views, so each bridge's rows show up as their own step in Dagster.
      bridges:
        +materialized: view
      prices:
        +materialized: view
      # Views, so each chain's metadata readings show up as their own step in Dagster.
      tokens:
        +materialized: view
      # Views, so each exchange version's fills show up as their own step in Dagster.
      polymarket:
        +materialized: view
        # Filters on jsonb staging columns keep the default selectivity, so the planner picks nested
        # loops that go quadratic on real loads; hash joins scale.
        +pre-hook: "set local enable_nestloop = off"
      # Views, so each chain's deployments show up as their own step in Dagster.
      deployments:
        +materialized: view
      # Views, so each source's orders, trades and transfers show up as their own step in Dagster.
      cow:
        +materialized: view
    marts:
      +materialized: table
      polymarket:
        # As for intermediate polymarket models: no nested loops.
        +pre-hook: "set local enable_nestloop = off"
      deployments:
        # The views it reads join on jsonb staging columns, and the planner's nested loops took three
        # minutes over a 2,990-block window; hash joins take seconds.
        +pre-hook: "set local enable_nestloop = off"

# The factory's reference rows, one seed per ticket (seeds/reference/README.md). Fixtures for the reference
# tests, not pipeline assets: Dagster leaves everything tagged reference out, the build run seeds them, and
# `dbt seed --select tag:reference` loads them on another warehouse.
seeds:
  transformation:
    reference:
      +tags: [reference]
