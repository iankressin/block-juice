name: transformation
version: "1.0.0"
profile: transformation

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

# The token the token_* analyses follow. To follow another, load its transfers, bridge moves and address
# code, then pass it with --vars '{token: {...}}'.
vars:
  token:
    ethereum: "0x1f9840a85d5af5bf1d1762f925bdaddc4201f984"
    decimals: 18
    windows:
      - {chain: arbitrum, token: "0xfa7f8980b0f1e64a2062791cc3b0871572f1f7f0", blocks: [510496864, 520129273]}
      - {chain: base, token: "0xc3de830ea07524a0761646a6a4e4be0e114a3c83", blocks: [52011727, 53350926]}
  # The transfer_share pipeline. Bump rule_version when a stage or movement rule changes, so shares from two
  # rule sets are never read as one series.
  transfer_share:
    rule_version: 1
    # One token per chain. decimals is the declared scale; tests compare it with what the chain reports.
    panel:
      - {chain: ethereum, token: "0xdac17f958d2ee523a2206206994597c13d831ec7", decimals: 6}
      - {chain: tron, token: "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t", decimals: 6}
      - {chain: solana, token: "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB", decimals: 6}
    # Unset until Ian sets it (decision 12): no label applies, so S4 and S5 remove nothing.
    label_min_confidence: null
    # The question's window, read only by the analyses: [from, to), UTC dates.
    window: {from: "2026-10-08", to: "2026-11-07"}

models:
  transformation:
    staging:
      +materialized: view
      # Tables, for the history sources that load millions of rows a day. Postgres cannot estimate a filter on
      # a raw row's jsonb, so through a view it guesses a few dozen rows and nests loops over millions. A
      # table gives it real row counts, and every model and test downstream reads parsed columns once.
      ethereum:
        stg_ethereum__tether_token: {+materialized: table}
        stg_ethereum__tether_token_transactions: {+materialized: table}
        stg_ethereum__tether_token_blocks: {+materialized: table}
      tron:
        stg_tron__tether_token: {+materialized: table}
        stg_tron__tether_token_transactions: {+materialized: table}
        stg_tron__tether_token_blocks: {+materialized: table}
      solana:
        stg_solana__spl_token: {+materialized: table}
        stg_solana__spl_token_transactions: {+materialized: table}
        stg_solana__spl_token_balances: {+materialized: table}
        stg_solana__spl_token_blocks: {+materialized: table}
    intermediate:
      +materialized: ephemeral
      # Views, not ephemeral, so each chain's rows show up as their own step in Dagster.
      balances:
        +materialized: view
      # Views, so each protocol version's rows show up as their own step in Dagster.
      dex:
        +materialized: view
      # Views, so each chain's transfers show up as their own step in Dagster.
      transfers:
        +materialized: view
      # Views, so each chain's code readings show up as their own step in Dagster.
      labels:
        +materialized: view
      # Views, so each bridge's rows show up as their own step in Dagster.
      bridges:
        +materialized: view
      prices:
        +materialized: view
      # Views, so each chain's metadata readings show up as their own step in Dagster.
      tokens:
        +materialized: view
      # Views, so each chain's boundaries, movements and day checks show up as their own step in Dagster. The
      # movement models are tables: each feeds the mart, the day checks and their tests, over millions of rows.
      transfer_share:
        +materialized: view
        int_ethereum_tether_token_movements: {+materialized: table}
        int_tron_tether_token_movements: {+materialized: table}
        int_solana_spl_token_movements: {+materialized: table}
    marts:
      +materialized: table
