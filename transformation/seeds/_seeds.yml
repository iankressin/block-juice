version: 2

seeds:
  - name: cex_addresses
    description: >-
      Exchange-labelled addresses that sent or received SQD on Arbitrum or Base in October 2026, from
      Dune's cex.addresses labels, exported on 2026-11-05. The export joined cex.addresses to Dune's
      erc20_arbitrum.evt_Transfer and erc20_base.evt_Transfer for SQD (Arbitrum
      0x1337420ded5adb9980cfc35f8f2b054ea86f8ab1, Base 0xd4554bea546efa83c1e6b389ecac40ea999b3e78) in
      blocks 510496864-520129273 and 52011727-53350926, and kept the labels of the addresses on either
      side. `label` is Dune's distinct_name. To label other addresses, add rows and say where they come from.
    config:
      column_types:
        chain: text
        address: text
        exchange: text
        label: text
    columns:
      - name: address
        data_tests: [not_null]
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [arbitrum, base]
  - name: arbitrum_token_gateways
    description: >-
      The L2 gateways of Arbitrum's token bridge, one row each. int_arbitrum_token_bridge_transfers keeps
      only the bridge logs these contracts emitted. The rows are the default gateway and the gateways that
      the L2GatewayRouter, 0x5288c571fd7ad117bea99bf60fe0846c4e84f933, returned from getGateway for UNI,
      USDC, WETH, DAI, LPT, GRT, wstETH, ARB and USDS on Ethereum, read at Arbitrum block 521602006 on
      2026-11-05. A token whose gateway is not here needs a row, or its moves leave no trace in the marts;
      the warn test on stg_arbitrum__token_bridge.contract lists such logs.
    config:
      column_types:
        address: text
        name: text
    columns:
      - name: address
        data_tests: [unique, not_null]
