version: 2

seeds:
  - name: attributed_addresses
    description: >-
      Addresses a public body attributes to an incident, one row per chain, address and incident.
      binance-hack-2026-10-29: the 608 Ethereum addresses in the FBI alert "North Korea responsible for $6
      billion Binance attack"
      (https://www.fbi.gov/investigate/cyber/alerts/2026/north-korea-responsible-for-6-billion-binance-attack),
      published 2026-10-31 and modified 2026-11-02, copied from ticket #41. published_address keeps the
      alert's capitalization; address is lowercase. The same list is the wallets in
      chains/ethereum/addresses.json of evm-wallet-transactions and evm-account-state: change all three
      together.
    config:
      column_types:
        chain: text
        address: text
        published_address: text
        attribution: text
        attributed_by: text
        published: date
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || lower(address) || ':' || attribution"
    columns:
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum]
      - name: address
        data_tests: [not_null]
      - name: attribution
        data_tests: [not_null]
  - name: cex_addresses
    description: >-
      Dune's cex.addresses rows for the addresses that sent or received UNI on Arbitrum or Base in October
      2026, from meta.dune_query run on 2026-11-05. To follow another token, run the query with its
      addresses and blocks and add the rows it returns.
    meta:
      dune_query: |
        with movers as (
            select 'arbitrum' as chain, "from" as address
            from erc20_arbitrum.evt_Transfer
            where contract_address = 0xfa7f8980b0f1e64a2062791cc3b0871572f1f7f0
                and evt_block_date between date '2026-10-01' and date '2026-10-31'
                and evt_block_number between 510496864 and 520129273
            union
            select 'arbitrum', "to"
            from erc20_arbitrum.evt_Transfer
            where contract_address = 0xfa7f8980b0f1e64a2062791cc3b0871572f1f7f0
                and evt_block_date between date '2026-10-01' and date '2026-10-31'
                and evt_block_number between 510496864 and 520129273
            union
            select 'base', "from"
            from erc20_base.evt_Transfer
            where contract_address = 0xc3de830ea07524a0761646a6a4e4be0e114a3c83
                and evt_block_date between date '2026-10-01' and date '2026-10-31'
                and evt_block_number between 52011727 and 53350926
            union
            select 'base', "to"
            from erc20_base.evt_Transfer
            where contract_address = 0xc3de830ea07524a0761646a6a4e4be0e114a3c83
                and evt_block_date between date '2026-10-01' and date '2026-10-31'
                and evt_block_number between 52011727 and 53350926
        )

        select
            c.blockchain as chain,
            lower(cast(c.address as varchar)) as address,
            c.cex_name as exchange,
            c.distinct_name as label
        from cex.addresses as c
        join movers as m on m.chain = c.blockchain and m.address = c.address
        order by 1, 3, 4, 2
    config:
      column_types:
        chain: text
        address: text
        exchange: text
        label: text
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || address"
    columns:
      - name: address
        data_tests: [not_null]
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [arbitrum, base]
  - name: arbitrum_token_gateways
    description: >-
      The rows are the default gateway and the gateways that the L2GatewayRouter, 0x5288c571fd7ad117bea99bf60fe0846c4e84f933, returned from getGateway for UNI,
      USDC, WETH, DAI, LPT, GRT, wstETH, ARB and USDS on Ethereum, read at Arbitrum block 521602006 on
      2026-11-05. A token whose gateway is not here needs a row, or its moves leave no trace in the marts;
      the warn test on stg_arbitrum__token_bridge.contract lists such logs.
    config:
      column_types:
        address: text
        name: text
    columns:
      - name: address
        data_tests: [unique, not_null]
  - name: chainlink_feeds
    description: >-
      One row per Chainlink aggregator an evm-chainlink-price-feeds source loads, with the feed it serves.
      feed, decimals and phase_id come from each proxy's description(), decimals() and
      phaseId()/phaseAggregators(), read on 2026-11-06; heartbeat_seconds from Chainlink's feed directory
      (feed_directory in catalog/protocols/chainlink/protocol.yaml). Each aggregator in a chain's
      addresses.json in that source needs a row here, or its rounds leave no trace in the marts; the warn
      test on each stg_<chain>__chainlink_price_feeds.aggregator lists such logs.
    config:
      column_types:
        chain: text
        feed: text
        proxy: text
        phase_id: integer
        aggregator: text
        decimals: integer
        heartbeat_seconds: integer
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || aggregator"
    columns:
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum, arbitrum, base]
      - name: feed
        data_tests: [not_null]
      - name: proxy
        data_tests: [not_null]
      - name: phase_id
        data_tests: [not_null]
      - name: aggregator
        data_tests: [not_null]
      - name: decimals
        data_tests: [not_null]
      - name: heartbeat_seconds
        data_tests: [not_null]
  - name: polymarket_contracts
    description: >-
      Polymarket's own contracts that act as stakeholder or redeemer for someone else, from
      catalog/protocols/polymarket/NOTES.md Q4, plus the three CTF Exchange v2 exchanges. The wallet
      ledger drops these contracts' own splits, merges and redemptions: the fills and the adapters' events
      name the real actor. Each exchange in the polygon-polymarket-ctf-exchange-v2 addresses.json, and each
      adapter in the polygon-polymarket-ctf one, needs a row, or double counts reach the marts. Two more
      rows list the tokens that back Polymarket's CTF positions (protocol.yaml): role collateral is
      USDC.e, behind binary markets, and role wrapped_collateral the NegRiskAdapter's wrapped collateral,
      behind neg-risk ones. They act for no one; the position ledger keeps a ConditionalTokens event only
      on the token behind its condition (NOTES.md Q4, "How money and positions move").
    config:
      column_types:
        address: text
        role: text
        version: text
    columns:
      - name: address
        description: The contract, lowercase.
        data_tests: [unique, not_null]
      - name: role
        description: >-
          exchange, collateral_adapter, neg_risk_adapter, auto_redeemer, module, collateral or
          wrapped_collateral.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [exchange, collateral_adapter, neg_risk_adapter, auto_redeemer, module, collateral, wrapped_collateral]
      - name: version
        description: The contract system it belongs to, ctf_exchange_v2, ctf or protocol_v2.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ctf_exchange_v2, ctf, protocol_v2]
