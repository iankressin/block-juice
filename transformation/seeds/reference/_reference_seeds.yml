version: 2

seeds:
  - name: reference_uni_v3_uni_swaps_2026_10_15
    description: >-
      #32: swaps and UNI volume per Uniswap v3 pool holding UNI (0x1f9840a85d5af5bf1d1762f925bdaddc4201f984)
      on Ethereum blocks 26194189 to 26201364 (2026-10-15T00:00:00Z to 2026-10-16T00:00:00Z), from the
      dune oracle: Dune query 9099271 (https://dune.com/queries/9099271), execution
      01M71D9WZ5R1R99CRVP8X63128, which joins uniswap_v3_ethereum.UniswapV3Pool_evt_Swap to
      Factory_evt_PoolCreated.
    config:
      column_types:
        pool: text
        swaps: numeric
        uni_volume: numeric
  - name: reference_binance_hack_fbi_eth_2026_11_01
    description: >-
      #41: for each FBI-attributed Binance hack address active on Ethereum blocks 26316189 to 26323364
      (2026-11-01T00:00:00Z to 2026-11-02T00:00:00Z), seven metrics in wei in long form: sent_value_wei,
      sent_fees_wei, sent_out_wei, received_wei over successful top-level transactions in the window, and
      balance_wei, nonce and has_code at block 26323364 (has_code also at 26294680). From the dune oracle:
      Dune query 9103455 (https://dune.com/queries/9103455, execution 01M732JJW5D0XSGMWE81A9T7K4) over seed
      list query 9103371 (fingerprint check 9103457); balance_wei, nonce and has_code from eth_getBalance,
      eth_getTransactionCount and eth_getCode on an Ethereum archive node pinned to block 26323364
      (has_code also at 26294680); both sent transactions' receipts checked by RPC.
    config:
      column_types:
        address: text
        metric: text
        amount: numeric
  - name: reference_rn1_polymarket_fills_2026_11_08
    description: >-
      #45: shares RN1 (Polymarket wallet 0x2005d16a84ceefa912d4e380cd32e7ff827875ea) traded per outcome
      token, side and maker/taker role on the CTF Exchange v2 exchanges, on Polygon blocks 96972629 to
      96975028 (2026-11-08T19:00:00Z to 2026-11-08T20:00:00Z), from the protocol_api oracle: Polymarket
      Data API GET https://data-api.polymarket.com/v2/activity?user=0x2005d16a84ceefa912d4e380cd32e7ff827875ea&start=1794164400&end=1794168000
      (type TRADE, paged by cursor) for every fill, and GET /v2/trades with the same user, start and end
      and the default taker-only filter for the taker fills; the rest are maker fills.
    config:
      column_types:
        token_id: text
        side: text
        role: text
        shares: numeric
