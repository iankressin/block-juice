[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dagster",
    "dagster-dbt",
    "dbt-postgres",
    "fpdf2>=2.8.9",
    "markdown>=3.10.3",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
blockjuice = "pipeline.cli:main"
bj = "pipeline.cli:main"

[dependency-groups]
dev = [
    "dagster-webserver",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.dagster]
module_name = "pipeline.definitions"
