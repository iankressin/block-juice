[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dagster",
    "dagster-dbt",
    "dbt-postgres",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.dagster]
module_name = "pipeline.definitions"
