name: cow-protocol
scope: >-
  CoW Protocol's GPv2 settlement on Ethereum and its ETH Flow contract, as far as an ETH Flow order
  needs them: an EOA sends ETH to ETH Flow with createOrder, ETH Flow emits OrderPlacement for a GPv2
  order that sells WETH, and a solver's settlement transaction later emits a Trade with that order's
  UID and pays the buy token to the order's receiver. Only what ticket #49 needs is here; ETH Flow's
  refunds and invalidations, and ordinary signed orders, are not loaded.
# The build run for #49 had no web access, so it read none of these. They are the pages the reviewer
# should check the two addresses against; until then the entry rests on chain data (see each contract).
docs:
  - https://docs.cow.fi/cow-protocol/reference/contracts/core
  - https://docs.cow.fi/cow-protocol/reference/contracts/periphery/eth-flow
  - https://github.com/cowprotocol/contracts/blob/main/networks.json
  - https://github.com/cowprotocol/ethflowcontract/blob/main/networks.prod.json
chains:
  ethereum:
    portal_dataset: ethereum-mainnet
    contracts:
      gpv2_settlement:
        address: "0x9008D19f58AAbD9eD0D60971565AA8510560ab41"
        deployed_block: null
        role: >-
          Settles batches of orders. Emits one Trade per order it fills, with the order's owner and
          UID, and sends each order's buy token to its receiver from its own balance.
        source: >-
          Chain data only, so far: the Trade logs in settlements 0x4ccf…48b3 (block 26380873) and
          0xafac…f1f6 (block 26385591) come from this address, carry the UIDs of the two ETH Flow
          orders placed in 0x53ed…fe36 and 0xee0a…a7a0, and the USDS Transfers to the order's receiver
          in the same transactions come from it. Not yet checked against CoW's networks.json (the build
          run had no web access); the reviewer should. Deploy block not read.
      eth_flow:
        address: "0xbA3cB449bD2B4ADddBc894D8697F5170800EAdeC"
        deployed_block: null
        role: >-
          Takes ETH from an EOA in createOrder, stores the order and returns its GPv2 order hash, emits
          OrderPlacement, and is the order's owner in the settlement's Trade. It wraps the ETH to WETH
          before the settlement takes it.
        source: >-
          Chain data only, so far: the subject's two createOrder transactions on 2026-11-10 go to this
          address, the OrderPlacement logs come from it, and the settlement's Trade names it as owner.
          An order through any other ETH Flow deployment is not loaded until its address is added to
          evm-cow-ethflow's addresses.json. Not yet checked against
          ethflowcontract's networks.prod.json. Deploy block not read.
events:
  ethflow.OrderPlacement:
    emitter: eth_flow
    signature: >-
      OrderPlacement(address indexed sender, (address sellToken, address buyToken, address receiver,
      uint256 sellAmount, uint256 buyAmount, uint32 validTo, bytes32 appData, uint256 feeAmount,
      bytes32 kind, bool partiallyFillable, bytes32 sellTokenBalance, bytes32 buyTokenBalance) order,
      (uint8 scheme, bytes data) signature, bytes data)
    topic0: "0xcf5f9de2984132265203b5c335b25727702ca77262ff622e136baa7362bf1da9"
    abi: abis/eth-flow.json
  ethflow.createOrder:
    emitter: eth_flow
    signature: createOrder((address,address,uint256,uint256,bytes32,uint256,uint32,bool,int64)) returns (bytes32 orderHash)
    sighash: "0x322bba21"
    abi: abis/eth-flow.json
  gpv2.Trade:
    emitter: gpv2_settlement
    signature: >-
      Trade(address indexed owner, address sellToken, address buyToken, uint256 sellAmount, uint256
      buyAmount, uint256 feeAmount, bytes orderUid)
    topic0: "0xa07a543ab8a018198e99ca0184c93fe9050a79400a0a723441f84de1d972cc17"
    abi: abis/gpv2-settlement.json
  erc20.Transfer:
    emitter: any ERC-20
    signature: Transfer(address indexed from, address indexed to, uint256 value)
    topic0: "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
    abi: abis/erc20.json
