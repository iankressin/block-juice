name: hypercore
scope: >-
  HyperCore fills as SQD Portal serves them in its hyperliquid-fills dataset: one record for each user's
  side of each trade on Hyperliquid's L1 order books. Orders that did not fill, cancels, funding and
  transfers are not in this dataset. HyperEVM is a separate EVM chain (Portal dataset
  hyperliquid-mainnet) and is not covered here.
docs:
  - https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/notation
chains:
  hypercore:
    portal_dataset: hyperliquid-fills
    # HyperCore is not an EVM chain. Fills are L1 records that Portal serves as they are, not logs a
    # contract emits, so there is no contract, topic or ABI to list.
    contracts: {}
