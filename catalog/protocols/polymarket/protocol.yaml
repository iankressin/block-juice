chains:
  polygon:
    portal_dataset: polygon-mainnet
    window_start_block: 94738440
    contracts:
      conditional_tokens:
        address: "0x4D97DCd97eC945f40cF65F87097ACe5EA0476045"
        deployed_block: 4023686
        role: >-
          Gnosis ConditionalTokens, the ERC-1155 ledger that holds every CTF-era position. Splits
          collateral into one position per index set, merges them back, and pays out after an oracle
          reports. Both exchange versions settle in it.
        source: >-
          conditionalTokens in clob-client-v2 src/config.ts (MATIC_CONTRACTS) and in polymarket-cli
          src/commands/mod.rs; getCtf() on all three v2 exchanges returned it on 2026-11-07. Deploy
          block from the create trace in tx
          0xf822536aff16fdb8df59bc9c0b5854c5bec4b9a76484ea9d6944908ced563389 (Portal stream API,
          create-trace filter), the first block where eth_getCode returns code.
      usdc_e:
        address: "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174"
        deployed_block: 5013591
        role: >-
          Bridged USDC (USDC.e), 6 decimals. The collateral of every binary CTF position: position
          ids are derived from it, even when users pay in pUSD.
        source: >-
          getCtfCollateral() on ctf_exchange_v2 returned it on 2026-11-07; USDCE in the collateral
          adapters' constructors. Deploy block from the create trace in tx
          0x51103659d8827d6d24732d1168de73390f4f387d58a8281944241657f1bc61d7.
      neg_risk_adapter:
        address: "0xd91E80cF2E7be2e162c6513ceD06f1dD0dA35296"
        deployed_block: 50505403
        role: >-
          Runs neg-risk events: prepares markets and questions, reports outcomes as the CTF oracle,
          and splits, merges, converts and redeems positions on ConditionalTokens with
          wrapped_collateral. It is the CTF stakeholder or redeemer of every neg-risk action.
        source: >-
          negRiskAdapter in clob-client-v2 src/config.ts and polymarket-cli. NEG_RISK_ADAPTER in the
          neg-risk collateral adapters. Deploy block from the create trace in tx
          0x192214f14b05d4404271a8d54d633d840277ba7b96df853417eb3fce274af2b9, which also created
          wrapped_collateral.
      wrapped_collateral:
        address: "0x3A3BD7bb9528E159577F7C2e685CC81A765002E2"
        deployed_block: 50505403
        role: >-
          The NegRiskAdapter's wrapper around USDC.e, 6 decimals. The collateral of every neg-risk CTF
          position, so neg-risk position ids are derived from it.
        source: >-
          getCtfCollateral() on neg_risk_ctf_exchange_v2 returned it on 2026-11-07. Created by
          neg_risk_adapter in tx 0x192214f14b05d4404271a8d54d633d840277ba7b96df853417eb3fce274af2b9.
      pusd:
        address: "0xC011a7E12a19f7B1f670d46F03B03f3342E82DFB"
        deployed_block: 84902320
        role: >-
          Polymarket USD (pUSD), the collateral of CTF Exchange v2, 6 decimals. Wraps USDC and
          USDC.e 1:1; the USDC.e sits in a vault (0xc417fd8e9661c0d2120b64a04bb3278c17e99db1 in
          every proof row). A UUPS proxy; implementation
          0xCe84E053301A82937F90ee2C2c1889cAb1db25dE on 2026-11-07.
        source: >-
          CollateralToken (proxy) in the ctf-exchange-v2 and polymarket-v2-external READMEs;
          collateral in clob-client-v2 src/config.ts; getCollateral() on all three v2 exchanges.
          Deploy block from the create trace in tx
          0xb182b902a72189a6b11d24b0f313439f899d2ef81a166489124c140eabb64841.
      ctf_exchange_v1:
        address: "0x4bFb41d5B3570DeFd03C39a9A4D8dE6Bd8B8982E"
        deployed_block: 33605403
        role: >-
          CTF Exchange v1, for binary markets, trading in USDC.e until the 2026-04-28 cutover. No
          OrderFilled in the window samples (NOTES.md, load estimate). It still emits
          TokenRegistered for some new markets.
        source: >-
          exchange in clob-client-v2 src/config.ts. Deploy block from the create trace in tx
          0x35423c49cb07c9ccecad9af20df52cccdeff0d46f833d438de8b02f2504aed22.
      neg_risk_ctf_exchange_v1:
        address: "0xC5d563A36AE78145C45a50134d48A1215220f80a"
        deployed_block: 50505492
        role: CTF Exchange v1 for neg-risk markets. No logs at all in the window samples.
        source: >-
          negRiskExchange in clob-client-v2 src/config.ts. Deploy block from the create trace in tx
          0x5935e680b186f72b6db932ce351dd6f0288b1e056ab8d0d307c5146606879369.
      ctf_exchange_v2:
        address: "0xE111180000d2663C0091e4f400237545B87B996B"
        deployed_block: 84902353
        role: >-
          CTF Exchange v2 for binary markets. Trades pUSD against CTF positions backed by USDC.e and
          mints or merges through ctf_collateral_adapter_v1 (its immutable outcome token factory).
        source: >-
          CTFExchangeV2 in the ctf-exchange-v2 README; exchangeV2 in clob-client-v2 src/config.ts.
          getCollateral() = pusd, getCtf() = conditional_tokens, getCtfCollateral() = usdc_e,
          getOutcomeTokenFactory() = ctf_collateral_adapter_v1 on 2026-11-07. Deploy block from the
          create trace in tx 0xd313453c195344b3eea2d91343fb840e51130ba5562fb9c9eda83fd0f82c6c97.
      neg_risk_ctf_exchange_v2:
        address: "0xe2222d279d744050d28e00520010520000310F59"
        deployed_block: 85058176
        role: >-
          CTF Exchange v2 for neg-risk markets ("NegRisk A" in the plan). Mints and merges through
          neg_risk_ctf_collateral_adapter_v1.
        source: >-
          NegRiskCtfExchangeV2 in the ctf-exchange-v2 README since commit 4a78ab09de (2026-04-03),
          negRiskExchangeV2 in clob-client-v2 src/config.ts. getCtfCollateral() = wrapped_collateral,
          getOutcomeTokenFactory() = neg_risk_ctf_collateral_adapter_v1 on 2026-11-07. Deploy block
          from the create trace in tx
          0x81a5c04d0582967b4305b577a4f63a1d9bf5b1f6e0b9c385234540b154446ade.
      neg_risk_ctf_exchange_v2_retired:
        address: "0xe2222d002000Ba0053CEF3375333610F64600036"
        deployed_block: 84902358
        role: >-
          The first NegRisk exchange v2 ("NegRisk B" in the plan), replaced on 2026-04-03. Its
          getCtfCollateral() returns usdc_e, not wrapped_collateral, so it cannot match neg-risk
          tokens; branch fix/nr-exchange-ctf-collateral in ctf-exchange-v2 fixes that in the deploy
          script. No logs in the window samples; NOTES.md gives its full history.
        source: >-
          NegRiskCtfExchangeV2 in the ctf-exchange-v2 README from commit 7d6d6683d4 (2026-04-01)
          until commit 4a78ab09de (2026-04-03). Deploy block from the create trace in tx
          0x595af18ec89e80e07d83dceade6413128ce990e94f760c639c2860e3c9cb6324.
      ctf_collateral_adapter_v1:
        address: "0xADa100874d00e3331D00F2007a9c336a65009718"
        deployed_block: 84902341
        role: >-
          The first pUSD adapter for binary CTF positions. ctf_exchange_v2 mints and merges through
          it, so it is the CTF stakeholder of every binary mint and merge match (proof rows 2, 3).
          Users can still call it to merge or redeem (proof row 25). It emits no event that names the
          user, and the CTF source leaves those direct calls out (NOTES.md Q5).
        source: >-
          CtfCollateralAdapter in the ctf-exchange-v2 README and polymarket-cli; verified on Sourcify
          as src/adapters/CtfCollateralAdapter.sol (events: ownership, roles, pause only). Owner
          0x47EbFAC3353314C788B96CDCbf41daadfE03629C, the same as pusd. Deploy block from the create
          trace in tx 0x1e7aa0eb72e0eb24f8e4b803544e60d45b89d1a0ebfc3d0ea7cb19ece73bd3c0.
      neg_risk_ctf_collateral_adapter_v1:
        address: "0xAdA200001000ef00D07553cEE7006808F895c6F1"
        deployed_block: 84902347
        role: >-
          The first pUSD adapter for neg-risk positions. neg_risk_ctf_exchange_v2 mints and merges
          through it, so it is the NegRiskAdapter stakeholder of every neg-risk mint and merge match
          (proof row 22). It emits no event that names the user.
        source: >-
          NegRiskCtfCollateralAdapter in the ctf-exchange-v2 README and polymarket-cli; verified on
          Sourcify (events: ownership, roles, pause only). Owner as pusd. Deploy block from the create
          trace in tx 0x4e82930278938b8dd64f31954fd1ba74298317dc79ba0e338d8999c58b053e5a.
      ctf_collateral_adapter:
        address: "0xAdA100Db00Ca00073811820692005400218FcE1f"
        deployed_block: 86179826
        role: >-
          The current pUSD adapter that users split, merge and redeem binary positions through. Emits
          PositionSplit, PositionsMerged and PositionsRedeemed with the user as initiator. First user
          event at block 86180662 (2026-04-29 16:49 UTC).
        source: >-
          CTF_COLLATERAL_ADAPTER_ADDRESS in MetaMask's Polymarket constants (not a Polymarket repo);
          verified on Sourcify as src/adapters/CtfCollateralAdapter.sol. Created through Polymarket's
          deployer 0xca71ea69c54c163d17beb90beb8d001e1eb538a1, which also sent the deploys of pusd and
          the v2 exchanges; owner as pusd. Deploy block from the create trace in tx
          0x1a152fa541c0e573a3bdbe7f4bcd402247b2ffed3c1f0a8973dcdf32901b9105.
      neg_risk_ctf_collateral_adapter:
        address: "0xadA2005600Dec949baf300f4C6120000bDB6eAab"
        deployed_block: 86179892
        role: >-
          The current pUSD adapter for neg-risk positions. Emits PositionSplit, PositionsMerged,
          PositionsRedeemed and PositionsConverted with the user as initiator.
        source: >-
          NEG_RISK_CTF_COLLATERAL_ADAPTER_ADDRESS in MetaMask's Polymarket constants; verified on
          Sourcify as src/adapters/NegRiskCtfCollateralAdapter.sol. Sent by deployer
          0xca71ea69c54c163d17beb90beb8d001e1eb538a1; owner as pusd. Deploy block from the create
          trace in tx 0xdfdef82a68dd53443abe6d3884a888bed18ed1854277bead094bc813f641595a.
      ctf_auto_redeem:
        address: "0xF3cFb6a6eBFeB51876289Eb235719EB1C65252B0"
        deployed_block: 86136861
        role: >-
          Redeems resolved CTF and neg-risk positions for many users in one transaction (sent
          through an ERC-4337 EntryPoint) and pays them in pUSD. Emits BinaryRedemption and
          NegRiskRedemption naming each user.
        source: >-
          Verified on Sourcify as src/CtfAutoRedeem.sol:CtfAutoRedeem. Owner
          0x47EbFAC3353314C788B96CDCbf41daadfE03629C, the same as pusd. Not in a Polymarket repo.
          Deploy block from the create trace in tx
          0x1c204065cf301b0e725d293ce53cd077a6894d9bc0f6e3d7ca15095a62c6093a.
      auto_redeemer:
        address: "0xa1200000d0002264C9a1698e001292D00E1b00af"
        deployed_block: 87479597
        role: >-
          Protocol V2's AutoRedeemer (UUPS proxy). Besides V2 positions it redeems CTF and neg-risk
          positions for users, the busiest redeemer in the window samples. Emits BinaryRedemption and
          NegRiskRedemption (same topics as ctf_auto_redeem) and, for V2 positions, Redemption, which
          names the user; the module's PositionRedeemed names the AutoRedeemer (proof row 35).
        source: >-
          AutoRedeemer (proxy) in the polymarket-v2-external README; implementation
          0x64860bFD14fCcaAc09cd36f347784a9616AfB66C (ERC-1967 slot, 2026-11-07 and 2026-11-08)
          verified on Sourcify as src/utils/AutoRedeemer.sol. Deploy block from the create trace in tx
          0xae932d6f7fc45e48d6e9a25855d233fe97af1d81ee3bfe8a551b3887af567883 (Portal MCP), the first
          block where eth_getCode returns code.
      position_manager:
        address: "0x006F54F7f9A22e0000CC2AB60031000000ae9fEF"
        deployed_block: 87479409
        role: >-
          Protocol V2's ERC-1155 ledger (UUPS proxy) that holds every V2 position. Only a position's
          module can mint or burn it (by the id's top byte). Emits TransferSingle and TransferBatch with
          the same topic0s as ConditionalTokens. The earliest V2 deploy block.
        source: >-
          PositionManager (proxy) in the polymarket-v2-external README; POSITION_MANAGER() on
          binary_module returned it on 2026-11-08. Implementation
          0xCc5De1e9D14a7AB75E872E23FC9D605518Bac2D0 (ERC-1967 slot, 2026-11-08), verified on
          Sourcify. Deploy block from the create trace in tx
          0x5b6d7449146a3435ec0fcd1691b2c3a35df0c98fad40418fe7dc6da943ffc93a.
      protocol_v2_exchange:
        address: "0xe3333700cA9d93003F00f0F71f8515005F6c00Aa"
        deployed_block: 87479471
        role: >-
          The Protocol V2 Exchange (UUPS proxy). Trades pUSD against V2 positions; mints and merges
          through the position's module itself, as initiator and recipient (proof rows 27, 28, 30).
          Emits OrderFilled, OrdersMatched and FeeCharged with the CTF Exchange v2 topic0s. First fill
          at block 87620369 (2026-05-29 17:22:47 UTC); 4,460,881 fills to block 96943000, 99% of them
          parlays.
        source: >-
          Exchange (proxy) in the polymarket-v2-external README. Implementation
          0x862f1cff1bd6246a2585e3622137e6f961b34e55 (ERC-1967 slot, 2026-11-08), verified on
          Sourcify as src/exchange/MigratableExchange.sol, which is not in the public repo; the
          README still lists 0x641b40ec414a076b9e79E703Fc7BF4EBEC248Bb7. Deploy block from the create
          trace in tx 0x802752af6f6ac8714b2e55ab242853c5eb39cbaf36b4ba67b309d342d1953583.
      router:
        address: "0x12121212006e4CD160D18e3f00711DA5c3372600"
        deployed_block: 87479565
        role: >-
          The Protocol V2 Router (UUPS proxy). Users split, merge, redeem and convert through it: it
          moves the user's pUSD or positions to the module, calls it with the user as recipient, and
          emits its own Router* event naming the user. The module's event names the Router as
          initiator (proof rows 32–34). Its combinatorialCollateralReturn runs any list of parlay ops
          with recipients the caller chooses, the module included, and emits only
          CombinatorialCollateralReturned(initiator) (proof row 42).
        source: >-
          Router (proxy) in the polymarket-v2-external README; implementation
          0x91fA5E2F12a308A13DefdB6aaF80B71DBe9B7696 (ERC-1967 slot, 2026-11-08), verified on
          Sourcify as src/routers/Router.sol. Deploy block from the create trace in tx
          0x12064d0797170d3345a3ad2edf8cbfa99f991c9c3a8f5c2569b61fde43a8acc9.
      binary_module:
        address: "0x1000008dD9001B968442c1000017eaE6E0dA00Ba"
        deployed_block: 87479502
        role: >-
          Protocol V2 BinaryModule (UUPS proxy, module id 1). Mints and burns binary V2 positions:
          native V2 markets, and CTF markets registered for migration. Redeems the legacy CTF positions
          users migrated into V2, so it appears as a CTF redeemer (proof rows 23, 38). Its
          ConditionResolved holds each binary V2 result.
        source: >-
          BinaryModule (proxy) in the polymarket-v2-external README; moduleId() = 1,
          CONDITIONAL_TOKENS() = conditional_tokens, USDCE() = usdc_e, POSITION_MANAGER() =
          position_manager, COLLATERAL_TOKEN() = pusd on 2026-11-08. Implementation
          0x66290cf3c362be3910c1b5572d381453fa7da2ba (ERC-1967 slot, 2026-11-08) is not verified on
          Sourcify; the README lists 0xf6428c0B5fa9361c0708CDdb95468cf54C56e9A2. Deploy block from
          the create trace in tx 0x106d3269f1216e2210fcdf4f8f153f1ea0c91f7c0c3b64f1f94ecc9864baaf04.
      neg_risk_module:
        address: "0x200000900045e3B6259600682756002200028933"
        deployed_block: 87479533
        role: >-
          Protocol V2 NegRiskModule (UUPS proxy, module id 2). Same as binary_module for neg-risk
          events, plus horizontal split and merge, conversion, and results it derives for sibling and
          synthetic Other conditions (proof rows 24, 39).
        source: >-
          NegRiskModule (proxy) in the polymarket-v2-external README. Implementation
          0xc4a3a6492df0d23f9fd1cfcd328dd10dbd5943b6 (ERC-1967 slot, 2026-11-07 and 2026-11-08),
          verified on Sourcify as src/modules/NegRiskModule.sol; the README lists
          0x39a5B01a100edF811f2748aa37B1313715Ded70e. Deploy block from the create trace in tx
          0xb5df3d49ae904c4142728d1507abb9407baace6254bd7f9ff08a2ac808410c68.
      combinatorial_module:
        address: "0x30000034706C7d8e12009DAB006Be20000c031A8"
        deployed_block: 87479439
        role: >-
          Protocol V2 CombinatorialModule (UUPS proxy, module id 3). Parlays: a condition whose YES
          pays the product of its legs' payouts (binary or neg-risk V2 positions) and whose NO pays
          the rest. Stores no result; a redemption reads the legs' results. Mints and burns the
          parlay positions the Exchange trades (proof rows 29, 30, 32–34, 40–42).
        source: >-
          CombinatorialModule (proxy) in the polymarket-v2-external README; implementation
