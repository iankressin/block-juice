abi_sources:
  abis/conditional-tokens.json: >-
    The event entries of artifacts/ConditionalTokens.json in Polymarket/ctf-exchange-v2 at ccc0596074.
  abis/neg-risk-adapter.json: >-
    The event entries of artifacts/NegRiskAdapter.json in Polymarket/ctf-exchange-v2 at ccc0596074.
    They match the event declarations in neg-risk-ctf-adapter src/NegRiskAdapter.sol.
  abis/ctf-exchange-v2.json: >-
    OrderFilled, OrdersMatched and FeeCharged from exchangeV2Abi in Polymarket/clob-client-v2
    src/order-utils/abi/ExchangeV2.ts at 27633b3c7d. They match ITrading.sol and Events.sol in
    ctf-exchange-v2.
  abis/collateral-adapter.json: >-
    The four position events of the Sourcify-verified NegRiskCtfCollateralAdapter at
    0xadA2005600Dec949baf300f4C6120000bDB6eAab. The verified CtfCollateralAdapter at
    0xAdA100Db00Ca00073811820692005400218FcE1f declares the first three with the same topic0s.
  abis/auto-redeemer.json: >-
    BinaryRedemption and NegRiskRedemption of the Sourcify-verified CtfAutoRedeem at
    0xf3cfb6a6ebfeb51876289eb235719eb1c65252b0. The verified AutoRedeemer implementation
    0x64860bFD14fCcaAc09cd36f347784a9616AfB66C declares the same two events, plus Redemption, the
    third entry, copied from it.
  abis/protocol-v2-exchange.json: >-
    OrderFilled, OrdersMatched and FeeCharged of the Sourcify-verified MigratableExchange
    implementation 0x862f1cff1bd6246a2585e3622137e6f961b34e55. They match the declarations in
    src/exchange/Exchange.sol of polymarket-v2-external at 741f8bbe88, and abis/ctf-exchange-v2.json.
  abis/protocol-v2-combinatorial-v1.json: >-
    The twelve parlay events whose shape changed at block 93452332, from the Sourcify-verified
    CombinatorialModule implementation 0x572cd48cce93b2e58f1cc0253a7fdd4b4952a9c2. The earlier
    verified implementations 0xb529b2430d78868422c47934d9d61cc9d0c53dbb and
    0x03cc063e6f9552e3842136538092134edc8962de declare the same (the first lacks ConvertedOnEvent,
    SplitOnEvent and MergedOnEvent).
  abis/protocol-v2-module.json: >-
    The position, resolution and migration events of the Sourcify-verified NegRiskModule
    implementation 0xc4a3a6492df0d23f9fd1cfcd328dd10dbd5943b6 (17) and the parlay events of the
    verified CombinatorialModule implementation 0xf96968a44022B17240B42c557693E7C383d2d8a3 (13).
    Both match polymarket-v2-external at 741f8bbe88 (BaseModule.sol, BaseMigrationMixin.sol,
    NegRiskModule.sol, CombinatorialModule.sol), where ConditionId is bytes31, EventId bytes29 and
    PositionId uint256. The current BinaryModule implementation is not verified; every topic0 it
    emitted from deploy to block 96943000 is in this file.
