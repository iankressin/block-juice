name: polymarket
scope: >-
  Polymarket on Polygon. The CTF era: positions held in Gnosis ConditionalTokens, neg-risk markets run
  by the NegRiskAdapter, fills on CTF Exchange v2 (live since 2026-04-28), and the collateral adapters
  and auto-redeemers that users split, merge, redeem and convert through with pUSD. CTF Exchange v1 is
  listed for its topics and to show it has no fills in the window. Protocol V2 (deployed 2026-05-26,
  first fill 2026-05-29): positions held in the PositionManager, minted and burned by the binary,
  neg-risk and combinatorial modules, traded on the Protocol V2 Exchange, reached through the Router
  and the AutoRedeemer. Most V2 fills are parlays (combinatorial positions) whose legs are CTF markets
  migrated into V2 (NOTES.md, Protocol V2).
