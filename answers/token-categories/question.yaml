question: How are the configured token transfers divided among exchange, bridge, contract and peer-to-peer
  flows?
definitions:
  token: 'UNI by default: the token mapping, decimals and inclusive chain block windows in this question''s
    parameters.token default. Override the complete token mapping together when following another asset.'
  amounts: Whole tokens after applying the configured decimals. Chain token contracts represent the same
    asset; no USD prices are applied.
  scope: Only loaded data for the configured token and chain windows. Configure and build the transfers
    pipeline before running; flows involving bridges also require the bridges and labels pipelines.
  bridge edges: An observed pair is anchored by a withdrawal in the configured window; its deposit may
    occur outside that window. Pairing uses amount and timing, not proof of the Ethereum leg, and does
    not establish that every possible later counterpart has been loaded.
marts:
- classified_transfers
- bridge_transfers
- bridge_pairs
- address_labels
analyses:
- token_categories
- token_categories_bridges
- token_categories_by_category
- token_categories_contracts
- token_categories_exchanges
- token_categories_p2p
window:
  blocks:
    arbitrum:
    - 510496864
    - 520129273
    base:
    - 52011727
    - 53350926
inputs:
- name: arbitrum_transfers
  strategy: history
  source: arbitrum.erc20_transfers
  filter:
    tokens:
    - '0xfa7f8980b0f1e64a2062791cc3b0871572f1f7f0'
- name: base_transfers
  strategy: history
  source: base.erc20_transfers
  filter:
    tokens:
    - '0xc3de830ea07524a0761646a6a4e4be0e114a3c83'
- name: arbitrum_bridge
  strategy: history
  source: arbitrum.token_bridge
  filter:
    tokens: ["0x1f9840a85d5af5bf1d1762f925bdaddc4201f984"]
- name: base_bridge
  strategy: history
  source: base.op_standard_bridge
  filter:
    tokens: ["0xc3de830ea07524a0761646a6a4e4be0e114a3c83"]
parameter_scope: token_windows
parameters:
  token:
    type: object
    properties:
      ethereum:
        type: string
        required: true
      decimals:
        type: integer
        required: true
      windows:
        type: array
        required: true
        items:
          type: object
          properties:
            chain:
              type: string
              required: true
            token:
              type: string
              required: true
            blocks:
              type: array
              items: integer
              required: true
    default:
      ethereum: '0x1f9840a85d5af5bf1d1762f925bdaddc4201f984'
      decimals: 18
      windows:
      - chain: arbitrum
        token: '0xfa7f8980b0f1e64a2062791cc3b0871572f1f7f0'
        blocks:
        - 510496864
        - 520129273
      - chain: base
        token: '0xc3de830ea07524a0761646a6a4e4be0e114a3c83'
        blocks:
        - 52011727
        - 53350926
expected_columns:
  token_categories: [exchange_share_pct]
  token_categories_bridges: [chain, direction, l2_address, l2_kind, ethereum_address, amount, block_timestamp,
    tx_hash, other_chain, other_l2_address, other_at]
  token_categories_by_category: [category, chain, transfers, amount, senders, recipients]
  token_categories_contracts: [chain, contract, counterparty, counterparty_kind, amount_to_contract, amount_from_contract,
    transfers_to_contract, transfers_from_contract]
  token_categories_exchanges: [exchange, chain, wallet, wallet_kind, wallet_exchange, amount_to_exchange,
    amount_from_exchange, transfers_to_exchange, transfers_from_exchange, through_deposit_address]
  token_categories_p2p: [chain, from_address, to_address, amount, transfers]
grain:
  token_categories_by_category: [category, chain]
