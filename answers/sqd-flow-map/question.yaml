question: >-
  Rebuild the SQD transfer graph of October 2026 on Arbitrum and Base with the exchange, contract, bridge
  and P2P data, so it shows new information rather than the same graph
asked: 2026-11-05
definitions:
  SQD, window, exchange, contract, EOA, bridge, P2P: As in answers/sqd-categories/question.yaml
  entity: >-
    A node of the graph. All the labelled addresses and inferred deposit addresses of one exchange are
    one entity, named for the exchange. A mint or burn makes the chain's bridge to Ethereum an entity.
    Every other address is its own entity
  edge: >-
    SQD that went from one entity to another in the window, per chain and category. Moves between an
    exchange's own addresses are left out. A paired Arbitrum-to-Base bridge flow is an edge across chains
  group: The kind of an entity for the flow matrix - exchange, contract, eoa or bridge
  cross-exchange wallet: >-
    An address that is no exchange, got SQD from one exchange and sent SQD to a different exchange in the
    window, directly or through that exchange's deposit addresses
alternatives:
  - Keep each exchange address as its own node
  - Count a wallet that gets SQD from an exchange and sends it back to the same exchange as cross-exchange
  - The other readings listed in answers/sqd-categories/question.yaml
window:
  from: 2026-10-01
  to: 2026-11-01
  blocks:
    arbitrum: [510496864, 520129273]
    base: [52011727, 53350926]
inputs:
  - name: arbitrum_sqd_transfers
    strategy: history
    mart: erc20_transfers
    source: arbitrum.erc20_transfers
    filter: {tokens: ["0x1337420ded5adb9980cfc35f8f2b054ea86f8ab1"]}
  - name: base_sqd_transfers
    strategy: history
    mart: erc20_transfers
    source: base.erc20_transfers
    filter: {tokens: ["0xd4554bea546efa83c1e6b389ecac40ea999b3e78"]}
  - name: arbitrum_bridge
    strategy: history
    mart: bridge_transfers
    source: arbitrum.token_bridge
    filter: {tokens: ["0x1337420ded5adb9980cfc35f8f2b054ea86f8ab1"]}
  - name: base_bridge
    strategy: history
    mart: bridge_transfers
    source: base.op_standard_bridge
    filter: {tokens: ["0xd4554bea546efa83c1e6b389ecac40ea999b3e78"]}
  - name: address_labels
    strategy: state
    mart: address_labels
marts: [erc20_transfers, address_labels, bridge_pairs]
analyses:
  - sqd_flow_map
  - sqd_flow_map_groups
  - sqd_flow_map_edges
  - sqd_flow_map_cross_exchange
