  - name: contract_deployments
    strategy: history
    source: ethereum.contract_deployments
    mart: deployment_state_gas
marts: [deployment_state_gas]
analyses:
  - eip8037_state_gas_deployments_2026_11_08
  - eip8037_state_gas_deployments_2026_11_08_by_threshold
  - eip8037_state_gas_deployments_2026_11_08_distribution
  - eip8037_state_gas_deployments_2026_11_08_wildcat
expected_columns:
  eip8037_state_gas_deployments_2026_11_08: [deployments_above_60m_gas_limit]
  eip8037_state_gas_deployments_2026_11_08_by_threshold: [threshold_gas, deployments_above, deployments,
