  eip8037_state_gas_deployments_2026_11_08_distribution: [deployments, creates, new_accounts, code_bytes,
    new_slots, min_state_gas, median_state_gas, p90_state_gas, p99_state_gas, max_state_gas, eip7702_transactions]
