question: Did daily ETH, USDT and USDC flows to and from Ethereum wallets labelled as MEXC change after FinCEN's 6 November 2026 Section 9714 order against MEXC Global?
asked: 2026-11-11
definitions:
  MEXC-labelled wallets: >-
    The 23 unique Ethereum owners in DefiLlama-Adapters cex/mexc-cex.js at commit 6d311eff62 (2026-11-05),
    rows with entity MEXC in transformation/seeds/wallet_labels.csv. 14 also carry an Etherscan "MEXC N" tag;
    the others are DefiLlama-only labels. No first-party MEXC list, no clustering, no hop-following.
  Binance counterparty: >-
    The other side of a flow is one of the 111 Ethereum addresses on Binance's Proof-of-Reserves endpoint,
    snapshot 2026-11-11, rows with entity Binance in transformation/seeds/wallet_labels.csv.
  tokens: >-
    Native ETH, USDT 0xdac17f958d2ee523a2206206994597c13d831ec7 and USDC
    0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48 on Ethereum mainnet. Same-symbol tokens at other contracts
    do not count.
  ETH flow: >-
    A successful top-level transaction with value > 0 whose from or to is a MEXC-labelled wallet. Internal
    ETH, which only call traces show, is not counted; failed transactions move no ETH.
  token flow: Every Transfer log of USDT or USDC whose from (topic1) or to (topic2) is a MEXC-labelled wallet.
  inflow: The receiver is a MEXC-labelled wallet and the sender is not.
  outflow: The sender is a MEXC-labelled wallet and the receiver is not.
  intra: Both sides are MEXC-labelled wallets. Reported on its own and left out of inflow, outflow and net.
  net: inflow - outflow, in whole tokens (ETH 18 decimals, USDT and USDC 6 from the tokens mart).
  day: >-
    The UTC day whose first block is the first at or after 00:00:00 UTC, assigned by block height.
  after the order: >-
    From 2026-11-06, the day of FinCEN's announcement, whose first block is 26352079. Before is the
    pre-window, 2026-10-16 through 2026-11-05.
alternatives:
  - Count intra-set transfers in gross inflow and outflow (4,700 ETH, 286M USDT and 416M USDC on 2026-11-07).
  - Count internal ETH from call traces (needs Portal traces).
  - Sweep attribution, treating MEXC user deposit addresses that forward into the labelled wallets as MEXC.
    Most Binance-to-MEXC flow lands on such deposit addresses first, so the Binance subset is a lower bound.
  - Take the day from 2026-11-10 (Federal Register) or 2026-11-07 (Elliptic's reported reclassification)
    as the break instead of the 2026-11-06 announcement.
window:
  chain: ethereum
  from: 2026-10-16T00:00:00Z
  to: 2026-11-11T00:00:00Z
  blocks: [26201365, 26387956]
eval_window:
  chain: ethereum
  from: 2026-11-07T00:00:00Z
  to: 2026-11-08T00:00:00Z
  blocks: [26359254, 26366423]
