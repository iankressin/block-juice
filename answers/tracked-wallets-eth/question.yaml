question: How much ETH do the tracked wallets hold right now?
asked: 2026-11-04
definitions:
  tracked wallets: The wallets in ingestion/sources/evm-eth-balances/chains/ethereum/addresses.json
  right now: Each wallet's latest ETH balance reading
window:
  chain: ethereum
  at: latest
inputs:
  - name: eth_balances
    strategy: state
    mart: latest_balances
marts: [latest_balances]
analyses: [tracked_wallets_eth, tracked_wallets_eth_by_wallet]
expected_columns:
  tracked_wallets_eth: [eth]
  tracked_wallets_eth_by_wallet: [wallet, block_number, eth, wei]
grain:
  tracked_wallets_eth_by_wallet: [wallet]
freshness: {max_age_hours: 48, require_model_build: true}
