question: How does the bot behind wallet 0x2005d16a84ceefa912d4e380cd32e7ff827875ea place its Polymarket quotes?
asked: 2026-11-16
definitions:
  RN1: The Polygon wallet 0x2005d16a84ceefa912d4e380cd32e7ff827875ea.
  bid: >-
    One of RN1's maker orders, all of which buy an outcome. An order's price is fixed; a fill at a new price is
    a new order.
  resting at once: >-
    Two of RN1's bids were on the book at the same moment when both filled in one block, or when one filled
    between the first and last fill of the other.
  bid sum: >-
    The sum of RN1's bids on the two outcomes of one market while both rested, in pUSD per pair. 1 minus the
    sum is the spread RN1 quoted, since a pair always pays 1 pUSD.
  prices: Rounded to 0.001 pUSD, the exchange's finest tick, to drop the rounding noise of shares and pUSD.
  phase: The block time against Gamma's game_start_time.
alternatives:
  - Take each side's lowest filled price in a block instead of its highest; a sweep through several levels would
    then give a lower sum.
  - Count the overlap of two orders from first to last fill only when each filled at least twice.
