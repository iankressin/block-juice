question: How does RN1 trade on Polymarket, by outcome token, role, market, phase and complementary pairs?
definitions:
  RN1: The Polygon wallet 0x2005d16a84ceefa912d4e380cd32e7ff827875ea.
  maker-side: The wallet's order rested on the book, as recorded by the exchange OrderFilled role; this
    is not the buy/sell direction.
  window: Polygon blocks 91743315 through 97042228, 10 Aug to 10 Nov 2026, the 92 days the RN1 Strategy
    Teardown article covers. bj answer --eval runs the reference fixture instead, blocks 96972629 through
    96975028 on 2026-11-08.
  loading: List RN1's wallet under wallets in the addresses.json of both polygon-polymarket-ctf and
    polygon-polymarket-ctf-exchange-v2 before the first load, then run the polymarket pipeline over the window.
  amounts: Whole shares and pUSD; fee_usdc is kept separate from the pre-fee traded amount.
marts:
- polymarket_wallet_fills
- polymarket_markets
- polymarket_market_participants
- polymarket_position_changes
