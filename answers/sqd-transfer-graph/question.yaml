question: Based on the SQD transactions we've indexed, a graph of the wallets that transact with each other, transferring SQD around, in the same window
asked: 2026-11-05
definitions:
  SQD: >-
    The SQD token at 0x1337420ded5adb9980cfc35f8f2b054ea86f8ab1 on Arbitrum and
    0xd4554bea546efa83c1e6b389ecac40ea999b3e78 on Base, as in answers/sqd-net-accumulators
  same window: October 2026, from 2026-10-01 00:00 UTC up to 2026-11-01 00:00 UTC, as in answers/sqd-net-accumulators
  wallet: >-
    Any address that sent or received SQD, contracts included. The zero address is left out, since
    mints come from it and burns go to it; they are not transfers between wallets
  transact with each other: >-
    An edge from A to B when A sent B at least one SQD Transfer in the window. Edges are directed and
    add up both chains; each edge keeps its transfer count and SQD amount per chain. A transfer from an
    address to itself is no edge
alternatives:
  - Undirected edges, joining A to B and B to A into one pair
  - Only pairs that sent SQD both ways
  - Keep mints and burns as edges from and to the zero address
  - Leave out zero-value transfers
  - One graph per chain instead of one for both
window:
  from: 2026-10-01
  to: 2026-11-01
  blocks:
    arbitrum: [510496864, 520129273]
    base: [52011727, 53350926]
inputs:
  - name: arbitrum_sqd_transfers
    strategy: history
    mart: erc20_transfers
    source: arbitrum.erc20_transfers
    filter: {tokens: ["0x1337420ded5adb9980cfc35f8f2b054ea86f8ab1"]}
  - name: base_sqd_transfers
    strategy: history
    mart: erc20_transfers
    source: base.erc20_transfers
    filter: {tokens: ["0xd4554bea546efa83c1e6b389ecac40ea999b3e78"]}
marts: [erc20_transfers]
analyses: [sqd_transfer_graph, sqd_transfer_graph_by_edge, sqd_transfer_graph_by_wallet]
