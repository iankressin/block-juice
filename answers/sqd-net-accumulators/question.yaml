question: Which wallets accumulated the most $SQD across Arbitrum and Base in the last month (net new)?
asked: 2026-11-04
definitions:
  SQD: >-
    The SQD token at 0x1337420ded5adb9980cfc35f8f2b054ea86f8ab1 on Arbitrum and
    0xd4554bea546efa83c1e6b389ecac40ea999b3e78 on Base, 18 decimals each, from Portal's token list
  last month: October 2026, from 2026-10-01 00:00 UTC up to 2026-11-01 00:00 UTC
  wallet: >-
    Any address that sent or received SQD, contracts included. The zero address is left out,
    since mints come from it and burns go to it
  net new: >-
    SQD the address received minus SQD it sent in the window, from the token's Transfer logs,
    added up over both chains by address
alternatives:
  - Count only wallets without code, leaving out pools, bridges, exchanges and staking contracts
  - The last 30 days (2026-10-05 to 2026-11-04) instead of the calendar month
  - Rank each chain on its own instead of adding the chains up
  - Count SQD received, ignoring what each address sent
window:
  from: 2026-10-01
  to: 2026-11-01
  blocks:
    arbitrum: [510496864, 520129273]
    base: [52011727, 53350926]
inputs:
  - name: arbitrum_sqd_transfers
    strategy: history
    mart: erc20_transfers
    source: arbitrum.erc20_transfers
    filter: {tokens: ["0x1337420ded5adb9980cfc35f8f2b054ea86f8ab1"]}
  - name: base_sqd_transfers
    strategy: history
    mart: erc20_transfers
    source: base.erc20_transfers
    filter: {tokens: ["0xd4554bea546efa83c1e6b389ecac40ea999b3e78"]}
marts: [erc20_transfers]
analyses: [sqd_net_accumulators, sqd_net_accumulators_by_wallet]
