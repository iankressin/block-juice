[project]
name = "blockjuice-website"
version = "0.1.0"
description = "Builds the BlockJuice website from the repo: landing page, analysis posts from published answers, and the changelog."
requires-python = ">=3.10,<3.14"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
